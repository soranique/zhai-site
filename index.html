<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>神誕齋期版本對照</title>
<meta name="description" content="江南週期性神誕持齋研究：神明在各版本齋期表中的記載，與實踐記錄、《申報》、風俗志的對照。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Sans+SC:wght@400;500;700&family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ring.css?v=b5298586">
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --surface-2: #f2f1ed;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #6f6d68;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --accent: #8a2b1a;
  /* 配色規則：硃紅（--accent）只用於強調與數量（熱力圖、重合度矩陣）；分類一律用下面這套礦物色（--cat1…6 + 兩種灰），已過色盲檢驗 */
  --cat1: #245f94; --cat2: #9a7fd1; --cat3: #1a9178; --cat4: #bd8b18; --cat5: #3f9ad0; --cat6: #5f7f3a; --cat-o: #a59c8e; --cat-u: #cfccc4;   /* 石青 青蓮 石綠 藤黃 天青 苔綠 暖灰 鉛灰 */
  --v1: var(--cat1); --v2: var(--cat2); --v3: var(--cat3); --v4: var(--cat4);
  --ev1: #245f94; --ev2: #6b95c4; --ev3: #b3cbe5;   /* 證據強度（有序）：石青由深到淺 */
  /* 字體：中文一律黑體；英文、法文、數字用蘋果系統字體（SF），非蘋果設備用外觀相近的 Inter；史料原文用楷體
     拉丁字體排在最前，它們不含漢字，漢字自動落到後面的黑體或楷體 */
  --font-latin: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", "Helvetica Neue", Arial, "PingFang SC", "Noto Sans SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  /* 原文不放 -apple-system：Safari 會借系統字體把漢字也排成蘋方，楷體就沒了 */
  --font-src: "Inter", "Helvetica Neue", Arial, "LXGW WenKai TC", "Kaiti TC", "STKaiti", "KaiTi", "BiauKai", "AR PL UKai TW", "AR PL UKai CN", serif;
  --hl: #fff3c4;
  --yuan: #f6ebe7; --yuan-line: #dcbcb0;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #242422;
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #9a9892;
    --grid: #2c2c2a; --axis: #383835; --accent: #e0846f;
    --cat1: #3567b0; --cat2: #9a82d6; --cat3: #2aa470; --cat4: #ba881a; --cat5: #4f9bd9; --cat6: #6f9440; --cat-o: #8d877c; --cat-u: #55595d;
    --ev1: #8fb3e0; --ev2: #4f7fc0; --ev3: #2c4b78;
    --hl: #4a3f12;
    --yuan: #2c201c; --yuan-line: #5a3a30;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #242422;
  --ink: #f0efec; --ink-2: #c3c2b7; --muted: #9a9892;
  --grid: #2c2c2a; --axis: #383835; --accent: #e0846f;
  --cat1: #3567b0; --cat2: #9a82d6; --cat3: #2aa470; --cat4: #ba881a; --cat5: #4f9bd9; --cat6: #6f9440; --cat-o: #8d877c; --cat-u: #55595d;
  --ev1: #8fb3e0; --ev2: #4f7fc0; --ev3: #2c4b78;
  --hl: #4a3f12;
  --yuan: #2c201c; --yuan-line: #5a3a30;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font: 15px/1.7 var(--font-body);
}
/* 各種語言界面同一套字體：中文黑體，英文、法文、數字用系統無襯線體，史料原文楷體 */
.tile .n, .fheat, .db-n, .tb-y, td.num, th.num { font-variant-numeric: tabular-nums; }   /* 只在需要上下對齊的數字上用等寬數字 */
a { color: var(--ink); text-decoration-line: underline; text-decoration-color: color-mix(in srgb, var(--accent) 50%, transparent); text-decoration-thickness: 1px; text-underline-offset: 3px; }
a:hover { color: var(--accent); text-decoration-color: currentColor; }

.yt, .q, .zr .zr-nm { font-family: var(--font-src); }   /* 史料原文：楷體；研究者的說明爲黑體 */
.yt { color: var(--ink); }
.ovhero { margin: 8px 0 28px; } .ovhero .zr-hint, .ovhero .zr-steps { display: none; } .ovhero .zr-sec { margin: 0; }
.ovhero { display: flex; flex-direction: column; } .ovhero figcaption { order: -1; color: var(--ink-2); font-size: 15px; max-width: 760px; margin: 0 0 10px; }
.ovhero .zr .zr-hero { grid-template-columns: minmax(0, 600px) minmax(0, 320px); justify-content: start; }
@media (max-width: 900px) { .ovhero .zr .zr-hero { grid-template-columns: minmax(0, 1fr); } }
header.top {
  border-bottom: 1px solid var(--grid); background: var(--surface);
  position: sticky; top: 0; z-index: 10;
}
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px; }
.top .wrap { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding-top: 10px; padding-bottom: 10px; }
.brand { font-weight: 700; font-size: 17px; letter-spacing: .04em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 8px; font-size: 13px; }
nav { display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto; }
nav a {
  text-decoration: none; color: var(--ink-2); padding: 4px 10px; border-radius: 6px; font-size: 14px;
}
nav a.on { background: var(--surface-2); color: var(--ink); font-weight: 600; }
select { max-width: 100%; }
.ringpick label { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; min-width: 0; max-width: 100%; }
#langs { display: inline-flex; border: 1px solid var(--grid); border-radius: 6px; overflow: hidden; }
#langs button { background: none; border: 0; border-left: 1px solid var(--grid); color: var(--ink-2); padding: 3px 8px; cursor: pointer; font: inherit; font-size: 13px; }
#langs button:first-child { border-left: 0; }
#langs button.on { background: var(--ink-2); color: var(--page); }
.hbtn, #theme { background: none; border: 1px solid var(--grid); color: var(--ink-2); border-radius: 6px; padding: 3px 8px; cursor: pointer; font: inherit; font-size: 13px; }
main { padding: 24px 0 64px; }
h1 { font-size: 26px; margin: 0 0 6px; }
h2 { font-size: 19px; margin: 32px 0 10px; }
h3 { font-size: 16px; margin: 22px 0 8px; }
.lede { color: var(--ink-2); max-width: 760px; margin: 0 0 20px; }
.card { background: var(--surface); border: 1px solid var(--grid); border-radius: 10px; padding: 16px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.tile .n { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }
.tile .l { color: var(--ink-2); font-size: 13px; }
.tile .s { color: var(--muted); font-size: 12px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 0 0 12px; }
.controls input[type=search], .controls select {
  font: inherit; font-size: 14px; padding: 5px 9px; border: 1px solid var(--axis); border-radius: 6px;
  background: var(--surface); color: var(--ink); min-width: 0;
}
.controls label { font-size: 14px; color: var(--ink-2); display: inline-flex; gap: 5px; align-items: center; }
.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--grid); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
.scroll table { min-width: 760px; }
th, td { text-align: left; vertical-align: top; padding: 7px 10px; border-bottom: 1px solid var(--grid); }
th { font-weight: 600; color: var(--ink-2); background: var(--surface-2); position: sticky; top: 0; white-space: nowrap; }
th.sortable { cursor: pointer; }
th.sortable:hover { color: var(--ink); }
tr.row { cursor: pointer; }
tr.row:hover td { background: var(--surface-2); }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: 0; }
.v-L0 { --c: var(--v1); } .v-L1 { --c: var(--v2); } .v-L2 { --c: var(--v3); } .v-L3 { --c: var(--v4); }
.v-W001 { --c: var(--v1); } .v-W014 { --c: var(--v2); } .v-W063 { --c: var(--v3); } .v-W085 { --c: var(--v4); }
.sw.v { background: var(--c); }
.cell-v { border-left: 3px solid var(--c); padding-left: 7px; }
.cell-empty { color: var(--axis); }
.tag { display: inline-block; font-size: 12px; padding: 0 6px; border-radius: 4px; border: 1px solid var(--axis); color: var(--ink-2); margin: 0 4px 2px 0; white-space: nowrap; }
.tag.strong { border-color: var(--ink-2); color: var(--ink); }
.flag { color: var(--accent); font-size: 12px; white-space: nowrap; }
/* calendar */
.cal { display: grid; grid-template-columns: 64px repeat(var(--lanes), minmax(150px, 1fr)); min-width: calc(64px + var(--lanes) * 150px); }
.cal > div { border-bottom: 1px solid var(--grid); border-right: 1px solid var(--grid); padding: 6px; }
.cal .hd { background: var(--surface-2); font-weight: 600; font-size: 13px; position: sticky; top: 0; }
.cal .mo { font-weight: 600; color: var(--ink-2); font-size: 14px; }
.chip {
  display: inline-block; font-size: 12px; line-height: 1.5; padding: 1px 6px; margin: 2px 3px 2px 0;
  border-radius: 4px; background: var(--surface-2); border-left: 3px solid var(--c, var(--axis)); cursor: pointer;
  color: var(--ink);
}
.chip.p { border-left: 3px solid var(--ink-2); }
.chip.p.weak { border-left-style: dotted; color: var(--ink-2); }
.chip.hl { background: var(--hl); outline: 1px solid var(--ink-2); }
.chip.lk::after { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--v3); margin-left: 4px; vertical-align: middle; }
.chip.lk.dev::after { background: var(--v4); }
.tag.fit { border-color: var(--v3); color: var(--ink); }
.tag.dev { border-color: var(--v4); color: var(--ink); background: color-mix(in srgb, var(--v4) 14%, transparent); }
.plk { white-space: nowrap; margin-right: 6px; font-size: 12px; }
.fit td { vertical-align: top; }
.fitg { cursor: pointer; }
.fitg:hover td { background: var(--surface-2); }
.fitg .tw { display: inline-block; width: 0; height: 0; border-left: 4.5px solid transparent; border-right: 4.5px solid transparent; border-top: 6px solid currentColor; vertical-align: 2px; margin-right: 2px; transition: transform .15s; }
.fitg:not(.open) .tw { transform: rotate(-90deg); }   /* 展開／收起的小三角用 CSS 畫，不依賴字體 */
#menu::before { content: ''; display: inline-block; width: 13px; height: 10px; margin-right: 6px; vertical-align: 0; background: linear-gradient(currentColor 0 0) top / 100% 2px no-repeat, linear-gradient(currentColor 0 0) center / 100% 2px no-repeat, linear-gradient(currentColor 0 0) bottom / 100% 2px no-repeat; }   /* 目錄圖標：三道橫線 */
.fitg.open td { background: var(--surface-2); font-weight: 600; }
.fitg.open td .small, .fitg.open td .muted { font-weight: 400; }
.fitd td { border-top: none; }
.fitd td:first-child { border-left: 3px solid var(--grid); }
.fday { display: inline-block; margin-right: 10px; white-space: nowrap; }
.rec.jump { background: var(--hl); transition: background 1.5s; }
/* ---- 刊刻地與版本線索圖 ---- */
.spread { --sea:#dfe8ee; --land:#f8f6f0; --coast:#aeab9f; --f1:var(--cat1); --f2:var(--cat4); --f5:var(--cat2); --f6:var(--cat6); --f0:var(--cat-o); --doc:var(--ink); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .spread { --sea:#1a1f22; --land:#23231f; --coast:#4a4944; } }
:root[data-theme="dark"] .spread { --sea:#1a1f22; --land:#23231f; --coast:#4a4944; }
.spread .sgrid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
@media (max-width: 900px) { .spread .sgrid { grid-template-columns: 1fr; } }
.spread svg.smap { width: 100%; height: auto; display: block; border-radius: 8px; }
.spread .sea { fill: var(--sea); } .spread .land { fill: var(--land); stroke: var(--coast); stroke-width: .7; }
.spread .grat { fill: none; stroke: var(--grid); stroke-width: .5; stroke-dasharray: 2 3; }
.spread .ibox { fill: var(--sea); stroke: var(--ink-2); stroke-width: 1; } .spread .ireg { fill: none; stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 3 2; } .spread .ititle { font-size: 12px; fill: var(--ink-2); }
.spread .sedge { fill: none; stroke-width: 2.2; cursor: pointer; }
.spread .sedge.inf { stroke-dasharray: 2 4; stroke-width: 2; } .spread .sedge.fam { stroke-dasharray: 7 5; }
.spread .sedge:hover, .spread .sedge.hl { stroke-width: 4; }
.spread .hit { fill: none; stroke: transparent; stroke-width: 14; cursor: pointer; }
.spread .spt { cursor: pointer; } .spread .spt text { font-size: 13px; fill: var(--ink); paint-order: stroke; stroke: var(--page); stroke-width: 3px; stroke-linejoin: round; }
.spread .spt .print { fill: var(--accent); stroke: var(--surface); stroke-width: 1.5; } .spread .spt .attr { fill: var(--surface); stroke: var(--accent); stroke-width: 2; } .spread .spt .acq { fill: var(--ink); stroke: var(--surface); stroke-width: 1.5; }
.spread .dim { opacity: .15; }
.spread g.spt.fhit circle, .spread g.spt.fhit rect { stroke: var(--ink); stroke-width: 2.5; }
.spread g.spt.fhit text { font-weight: 700; }
.spread .yr { font-size: 10.5px; fill: var(--ink-2); paint-order: stroke; stroke: var(--page); stroke-width: 3px; }
.spread .slg { display: grid; grid-template-columns: 34px 1fr; gap: 4px 8px; align-items: center; font-size: 13px; margin-bottom: 10px; }
.spread .slg svg, .spread .sflt svg { width: 34px; height: 16px; flex: none; }
.spread .sflt label { display: flex; gap: 6px; align-items: center; font-size: 13px; margin: 3px 0; cursor: pointer; }
.spread .ssw { display: inline-block; width: 22px; height: 0; border-top: 3px dashed; vertical-align: middle; }
.spread ul.sev { list-style: none; padding: 0; margin: 0; font-size: 13px; }
.spread ul.sev li { padding: 6px 0; border-top: 1px solid var(--grid); cursor: pointer; }
.spread ul.sev li:hover { background: var(--surface-2); }

/* ---- 版本親疏 ---- */
.kin { --l1:var(--cat1); --l2:var(--cat2); --l3:var(--cat3); --l4:var(--cat4); --l5:var(--cat5); --l6:var(--cat6); --l7:var(--cat-u); --edge:#52514e; --heat0:#f2f1ed; --heat1:var(--accent); }   /* 文本類型＝分類色；重合度矩陣＝數量，用硃紅 */
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .kin { --edge:#bdbbb3; --heat0:#262624; } }
:root[data-theme="dark"] .kin { --edge:#bdbbb3; --heat0:#262624; }
.kin svg.knet { display: block; width: 100%; height: auto; }
.kin .lane { fill: var(--surface-2); } .kin .lanet { font-size: 12.5px; fill: var(--ink-2); } .kin .tick { stroke: var(--grid); stroke-width: 1; } .kin .tickt { font-size: 11px; fill: var(--muted); }
.kin .e { fill: none; stroke: var(--edge); stroke-linecap: round; cursor: pointer; } .kin .e.sv { stroke: var(--accent); } .kin .e:hover, .kin .e.hl { stroke: var(--accent); opacity: 1 !important; }
.kin .hit { fill: none; stroke: transparent; stroke-width: 12; cursor: pointer; }
.kin .d { fill: none; stroke: var(--ink); stroke-width: 2.2; marker-end: url(#karr); } .kin .d.cand { stroke-dasharray: 6 4; }
.kin .nd { cursor: pointer; } .kin .nd circle { stroke: var(--surface); stroke-width: 2; } .kin .nd text { font-size: 12px; fill: var(--ink); paint-order: stroke; stroke: var(--page); stroke-width: 3px; stroke-linejoin: round; }
.kin .eg.dim { opacity: .12; }
.kin .kgrid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; } @media (max-width: 900px) { .kin .kgrid { grid-template-columns: minmax(0, 1fr); } }
.kin table.hm { border-collapse: collapse; font-size: 11.5px; width: auto; } .kin table.hm th { font-weight: 400; color: var(--ink-2); padding: 2px 4px; white-space: nowrap; background: none; position: static; } .kin table.hm th.r { text-align: right; }
.kin table.hm td { width: 34px; height: 24px; text-align: center; border: 1px solid var(--page); padding: 0; } .kin table.hm th.c2 { font-size: 10.5px; line-height: 1.25; vertical-align: bottom; width: 34px; white-space: normal; word-break: break-all; padding: 2px 1px; }
.kin .ksw { display: inline-block; width: 11px; height: 11px; border-radius: 50%; vertical-align: -1px; margin-left: 4px; }
.spread .st { font-size: 11px; border: 1px solid var(--axis); border-radius: 4px; padding: 0 4px; margin-left: 4px; color: var(--ink-2); white-space: nowrap; }

.chip .dd { color: var(--muted); margin-right: 3px; }
/* profile */
/* 年代篩選與播放 */
.tbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin: 14px 0 10px; padding: 8px 10px; border: 1px solid var(--grid); border-radius: 8px; background: var(--surface); font-size: 13.5px; }
.tb-l { font-weight: 600; margin-right: 2px; }
.tb-b, .tb-play { font: inherit; font-size: 13px; border: 1px solid var(--axis); background: none; color: var(--ink-2); border-radius: 999px; padding: 2px 11px; cursor: pointer; }
.tb-b.on { border-color: var(--accent); color: var(--ink); background: color-mix(in srgb, var(--accent) 10%, transparent); font-weight: 600; }
.tb-play { border-color: var(--accent); color: var(--accent); }
.tb-r { position: relative; display: inline-block; width: 240px; height: 22px; }
.tb-r input { position: absolute; left: 0; right: 0; top: 0; width: 100%; margin: 0; pointer-events: none; background: none; -webkit-appearance: none; appearance: none; height: 22px; }
.tb-r input::-webkit-slider-thumb { pointer-events: auto; -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); border: 2px solid var(--surface); cursor: pointer; margin-top: -5px; }
.tb-r input::-moz-range-thumb { pointer-events: auto; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); border: 2px solid var(--surface); cursor: pointer; }
.tb-r input::-webkit-slider-runnable-track { height: 4px; background: transparent; }
.tb-r input:first-child::-webkit-slider-runnable-track { background: var(--grid); border-radius: 2px; }
.tbar.dim-r .tb-r { opacity: .45; }
.tb-y { min-width: 84px; font-variant-numeric: tabular-nums; }
.tb-cur { font-size: 20px; color: var(--accent); }
.fb-time { margin-left: 14px; }
@media (max-width: 760px) { .tb-r { width: 100%; } }
/* 兩本對照 */
.cmp-pick label { display: inline-flex; gap: 6px; align-items: center; }
.cmp-pick select { max-width: 260px; }
#cswap { font: inherit; border: 1px solid var(--axis); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 2px 8px; cursor: pointer; }
.cmp-head, .cmp-cols { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0 28px; }
.cmp-head { position: sticky; top: 0; z-index: 2; background: var(--page); font-weight: 600; font-size: 14px; padding: 8px 0; border-bottom: 2px solid var(--axis); margin-top: 18px; }
.cmp-m { border-bottom: 1px solid var(--grid); padding: 10px 0 12px; }
.cmp-mn { font-weight: 600; margin-bottom: 6px; }
.cmp-cols { position: relative; }
.cc { display: flex; flex-direction: column; gap: 4px; min-width: 0; position: relative; z-index: 1; }
.ci { background: var(--surface); border: 1px solid var(--grid); border-radius: 6px; padding: 4px 8px; font-size: 13.5px; line-height: 1.5; }
.ci.fx { outline: 2px solid var(--accent); }
.ci-d { display: inline-block; min-width: 1.6em; font-weight: 700; font-variant-numeric: tabular-nums; }
.ci-o { color: var(--accent); }
.cmp-ln { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; z-index: 0; }

/* 長說明摺疊；需要始終看到的限定語留在外面 */

<script>
(function () {
'use strict';
var D = window.ZHAI;
var app = document.getElementById('app');
var tip = document.getElementById('tip');

// ---------- 語言 ----------
var I = window.ZhaiI18n, L = I.L, N = I.N, NT = I.NT, C = I.C, DT = I.D;
I.addPinyin(D.py, D.pyTitle);
if (window.ZHAI_RING) I.addPinyin(window.ZHAI_RING.py, window.ZHAI_RING.pyTitle);
document.getElementById('share').onclick = function () { copyText(shareURL(true), L('已複製本頁鏈接：對方打開看到的是同一畫面', 'Link copied: it opens this same view', 'Lien copié : il ouvre cette même vue')); };
document.getElementById('demo').onclick = function () { if (DEMO.on) demoExit(); else demoGo(0); };
document.querySelectorAll('#langs [data-lang]').forEach(function (b) { b.onclick = function () { var l = b.getAttribute('data-lang'); if (l === I.lang) return; I.set(l); footer(); route(); }; });

// ---------- 主題 ----------
var themeBtn = document.getElementById('theme');
try { var saved = localStorage.getItem('zhai-theme'); if (saved) document.documentElement.setAttribute('data-theme', saved); } catch (e) {}
themeBtn.onclick = function () {
  var cur = document.documentElement.getAttribute('data-theme');
  var dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  var next = dark ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('zhai-theme', next); } catch (e) {}
};

// ---------- 數據索引 ----------
var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
var G = {}; D.deities.forEach(function (g) { G[g.id] = g; });
// 數據庫「文獻」表登記的齋曆文本：只用於列出「尚未取得」者
var V = {}; D.versions.forEach(function (v) { V[v.id] = v; });
function vYear(v) { return v.year ? String(v.year) : (v.date ? C(v.date) : L('年代未定', 'undated')); }
var MISSING = D.versions.filter(function (v) { return /未取得/.test(v.status); });

// 齋曆：「玉匣記版本對比」工作簿是唯一來源；神明與齋庫神明 ID（ZS###，2026-10-29 前寫作 G###）的對應來自神明總表的「齋庫神明ID（ZS）」欄（未核者用候選並標「待覈」）
// 注意：工作簿裏的「神明編碼（G####）」（如 G0303）是研究者自己的神明編碼，與 ZS### 是兩套編號
var ED = window.ZHAI_ED || { versions: [], entries: [], norms: {}, cmap: {}, py: {}, pyTitle: {} };
I.addPinyin(ED.py, ED.pyTitle);
var EVS = ED.versions.slice().sort(function (a, b) { return (a.year || 9999) - (b.year || 9999) || a.i - b.i; });
var V0 = (ED.versions.filter(function (v) { return +v.no === 1; })[0] || ED.versions[0] || {}).i;  // 道藏本《玉匣記》1607
var EBYID = {}; ED.entries.forEach(function (e) { if (e.id) EBYID[e.id] = e; });
function normGs(k) { var n = ED.norms[k]; return n && n[0] ? n[0].split(/[\/+]/) : []; }
function normCode(k) { var n = ED.norms[k]; return (n && n[3]) || ''; }
function normPending(k) { var n = ED.norms[k]; return !!(n && n[1]); }
function eKey(e) { var g = normGs(e.k)[0]; return g || (e.k ? 'k:' + e.k : ''); }
function keyHref(k) { return k.indexOf('k:') === 0 ? '#ed/' + encodeURIComponent(k.slice(2)) : '#g/' + k; }

var MN = ['', '正月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '十一月', '十二月'];
function monthName(m) { return I.en() ? I.mon(m) : MN[m]; }
function gName(id) { return G[id] ? G[id].name : id; }

var byG = {};
function bucket(id) { return byG[id] || (byG[id] = { ed: {}, nCal: 0, norms: {}, pending: false, prac: [], sb: [], fs: [], cl: [] }); }
ED.entries.forEach(function (e) {
  if (!e.k) return;
  normGs(e.k).forEach(function (g) {
    if (!G[g]) return;
    var b = bucket(g);
    (b.ed[e.v] = b.ed[e.v] || []).push(e); b.nCal++; b.norms[e.k] = 1;
    if (normPending(e.k)) b.pending = true;
  });
});
D.practice.forEach(function (p) { if (p.g) bucket(p.g).prac.push(p); });
// 實踐記錄 ↔ 齋曆條目：實踐記錄的「對應齋期表條目ID」（舊 C 編號經 cmap 換算）與「對應關係」
var REL_FIT = '貼合', REL_DEV = '存在偏差';
function pCal(p) { return p.cal ? (ED.cmap[p.cal] || p.cal) : ''; }
function isDev(p) { return String(p.rel || '').indexOf(REL_DEV) === 0; }
var PBYE = {};
D.practice.forEach(function (p) { var id = pCal(p); if (id && EBYID[id]) (PBYE[id] = PBYE[id] || []).push(p); });
var LINKED = D.practice.filter(function (p) { return pCal(p) && EBYID[pCal(p)]; });
function relTag(p) {
  if (!p.rel) return '';
  return '<span class="tag' + (p.rel === REL_FIT ? ' fit' : isDev(p) ? ' dev' : '') + '">' + esc(C(p.rel)) + '</span>';
}
// 齋曆條目下列出對應的實踐記錄（點擊到該神明檔案中的這條記錄）
function pLinks(e) {
  var ps = PBYE[e.id]; if (!ps) return '';
  return '<div class="small">' + L('實踐：', 'Practice: ') + ps.map(function (p) {
    return '<a class="plk" href="' + (p.g ? '#g/' + p.g + '/' + p.id : '#fit') + '" title="' + esc(DT(p.date) + '｜' + NT(p.wt) + '｜' + C(p.rel)) + '">' + esc(p.id) + (isDev(p) ? L('（偏差）', ' (dev.)') : '') + '</a>';
  }).join('') + '</div>';
}
function eShort(e) { var v = ED.versions[e.v]; return edWhen(v) + ' ' + N(v.short) + ' ' + esc((e.mo || '') + (e.dy || '')); }
D.shenbao.forEach(function (s) { s.gs.forEach(function (g) { bucket(g).sb.push(s); }); });
D.fengsu.forEach(function (s) { s.gs.forEach(function (g) { bucket(g).fs.push(s); }); });
D.classics.forEach(function (s) { s.gs.forEach(function (g) { bucket(g).cl.push(s); }); });
var NOFAST = '僅日期巧合';
function fastPrac(b) { return b.prac.filter(function (p) { return p.ev !== NOFAST; }); }
function firstDated(es) { return (es || []).filter(function (e) { return e.m && e.d; })[0]; }
function godLink(id, txt) { return '<a href="#g/' + id + '">' + (txt ? esc(txt) : N(gName(id))) + '</a>'; }
function vSw(cls) { return '<span class="sw v ' + cls + '"></span>'; }
function aliases(s) { return I.en() ? s.split(/[、，,；;]/).map(function (a) { return N(a.trim()); }).join(', ') : esc(s); }
function zhNote() { return I.en() ? ' <span class="muted small">[' + L('', 'Chinese', 'chinois') + ']</span>' : ''; }
function pendTag(b) { return b && b.pending ? ' <span class="flag" title="' + esc(L('神明與齋曆條目按名稱對應，尚未覈對', 'Deity matched to calendar entries by name, not yet verified')) + '">' + L('待覈', 'to verify') + '</span>' : ''; }
// 實踐記錄裏「對應齋期表條目ID」（舊 C 編號）→ 工作簿條目ID
function calRef(c) {
  if (!c) return '';
  var id = ED.cmap[c] || c, e = EBYID[id];
  return e ? '<a href="#ev/' + e.v + '">' + esc(id) + '</a> ' + eShort(e) + (id !== c ? ' <span class="muted small">(' + esc(c) + ')</span>' : '') : esc(c);
}
function edSh(v) { var K = window.ZHAI_KIN, n = K && K.nodes.filter(function (x) { return x.no === +v.no; })[0]; return n ? n.sh : +v.no === 2 ? '許真君玉匣記' : v.short; }
function edHead(v) { return '<th class="edc' + (v.yuxia ? '' : ' ox') + '" title="' + esc(v.sheet) + '"><a href="#ev/' + v.i + '"><span class="yr">' + edWhen(v) + '</span><span class="vt">' + esc(I.en() ? (I.py(edSh(v)) || I.py(v.short) || v.short) : edSh(v)) + '</span></a></th>'; }
function edCell(v, es, cls) {
  if (!es) return '<td class="edc' + (v.yuxia ? '' : ' ox') + ' cell-empty">·</td>';
  var e = firstDated(es);
  return '<td class="edc' + (v.yuxia ? '' : ' ox') + (cls || '') + '"' + (e ? ' data-day="' + e.m + '/' + e.d + '"' : '') + ' title="' + esc(es.map(function (x) { return x.id + ' ' + (x.mo + x.dy) + ' ' + (x.t || x.g || ''); }).join('\n')) + '">' + (e ? e.m + '/' + e.d : '○') + (es.length > 1 ? '<span class="xn">×' + es.length + '</span>' : '') + '</td>';
}

// ---------- 跨頁聯動：神明聚焦、「這一天」面板、全站搜索 ----------
// 聚焦對象：數據庫神明（ZS###）或工作簿裏尚無 ZS 的規範名（k:規範名）。各頁據此只突出這一位神。
var FOCUS = null;
function focusFromKey(key) {
  if (!key) return null;
  if (key.indexOf('k:') === 0) {
    var nm = key.slice(2), g = normGs(nm).filter(function (x) { return G[x]; })[0];
    if (g) return focusFromKey(g);
    if (!edIndex() || !edIndex().rows[nm]) return null;
    var o = {}; o[nm] = 1;
    return { key: key, g: '', name: nm, norms: o };
  }
  if (!G[key]) return null;
  var b = byG[key] || bucket(key), ns = {};
  Object.keys(b.norms).forEach(function (k) { ns[k] = 1; });
  return { key: key, g: key, name: G[key].name, norms: ns };
}
function setFocus(key) {
  FOCUS = focusFromKey(key);
  try { if (FOCUS) localStorage.setItem('zhai-focus', FOCUS.key); else localStorage.removeItem('zhai-focus'); } catch (e) {}
  focusBar(); route();
}
try { FOCUS = focusFromKey(localStorage.getItem('zhai-focus')); } catch (e) {}
function fNorm(k) { return !!(FOCUS && k && FOCUS.norms[k]); }                       // 齋曆條目的規範名屬於聚焦神明
function fPrac(p) {                                                                  // 實踐記錄屬於聚焦神明（無聚焦時一律爲真）
  if (!FOCUS) return true;
  if (FOCUS.g && p.g) return p.g === FOCUS.g;
  var e = EBYID[pCal(p)]; return !!(e && fNorm(e.k));
}
function focusName() { return FOCUS ? N(FOCUS.name) : ''; }
function focusHref() { return FOCUS ? (FOCUS.g ? '#g/' + FOCUS.g : '#ed/' + encodeURIComponent(FOCUS.name)) : ''; }
// 頁面上的一行提示：本頁正按聚焦神明顯示
function focusNote(what) {
  return FOCUS ? '<div class="fnote">' + L('神明聚焦：', 'Focused deity: ') + '<a href="' + focusHref() + '"><b>' + focusName() + '</b></a> · ' + what + ' <button type="button" class="linkbtn" data-unfocus>' + L('取消聚焦', 'Clear focus') + '</button></div>' : '';
}
function focusBar() {
  var el = document.getElementById('focusbar');
  var tOn = typeof TIME !== 'undefined' && timeOn();
  if (!FOCUS && !tOn) { el.hidden = true; el.innerHTML = ''; return; }
  el.hidden = false;
  el.innerHTML = '<div class="wrap">' + (FOCUS ? L('神明聚焦：', 'Focused deity: ') + '<a href="' + focusHref() + '"><b>' + focusName() + '</b></a>' +
    (FOCUS.g ? ' <span class="muted small">' + esc(FOCUS.g) + '</span>' : '') +
    '<span class="muted small">' + L('　各頁只突出這位神：環形曆、熱力圖、諸本對照、版本線索圖、版本對照、齋期日曆', '　Every page highlights this deity: ring, heat map, collation, map, editions, calendar') + '</span>' +
    ' <button type="button" class="linkbtn" data-unfocus>' + L('取消', 'Clear') + '</button>' : '') +
    (tOn ? '<span class="fb-time">' + L('年代：', 'Years: ') + '<b>' + esc(timeLabel()) + '</b><span class="muted small">' + L('（實踐與齋曆、版本線索圖、這一天）', ' (practice × calendar, map, this day)') + '</span> <button type="button" class="linkbtn" data-untime>' + L('取消', 'Clear') + '</button></span>' : '') + '</div>';
}
document.addEventListener('click', function (e) {
  if (e.target.closest('[data-unfocus]')) { e.preventDefault(); setFocus(null); return; }
  if (e.target.closest('[data-untime]')) { e.preventDefault(); setTime('all'); return; }
  var f = e.target.closest('[data-focus]');
  if (f) { e.preventDefault(); setFocus(f.getAttribute('data-focus')); return; }
  var d = e.target.closest('[data-day]');
  if (d && !e.target.closest('a')) { e.preventDefault(); e.stopPropagation(); var md = d.getAttribute('data-day').split('/'); openDay(+md[0], +md[1]); }
}, true);
function focusBtn(key) {
  var on = FOCUS && FOCUS.key === (focusFromKey(key) || {}).key;
  return on ? '<button type="button" class="fbtn on" data-unfocus>' + L('取消聚焦', 'Clear focus') + '</button>' : '<button type="button" class="fbtn" data-focus="' + esc(key) + '">' + L('聚焦此神', 'Focus on this deity') + '</button>';
}

// ---------- 「這一天」：各版本這一天的條目（原文照錄）對照對上的實踐記錄 ----------
var DAY = { m: 0, d: 0, only: true };
function dayName(m, d) { return I.en() ? I.monDay(m, d) : MN[m] + FIT_DN(d); }
function rangeHas(r, m, d) {
  return String(r || '').split(/[；;]/).some(function (seg) {
    var a = seg.split('-').map(function (x) { return x.split('/').map(Number); });
    if (!a[0] || !a[0][1]) return false;
    var s = a[0][0] * 100 + a[0][1], t = a[1] && a[1][1] ? a[1][0] * 100 + a[1][1] : s, k = m * 100 + d;
    return k >= s && k <= t;
  });
}
function dayEntries(m, d) {
  return ED.entries.filter(function (e) { return (e.m === m && e.d === d) || (e.r && rangeHas(e.r, m, d)); });
}
function openDay(m, d) {
  if (!m || !d) return;
  DAY.m = m; DAY.d = d;
  var box = document.getElementById('daypanel');
  box.hidden = false; document.body.classList.add('dayopen');
  renderDay();

function showTip(e, html) {
  if (TOUCH) {
    var act = TIP_ACT;
    tip.innerHTML = html + '<div class="tip-a">' + (act ? '<button type="button" class="tip-go">' + act.label + '</button>' : '') + '<button type="button" class="tip-x" aria-label="' + L('關閉', 'Close') + '">✕</button></div>';
    tip.classList.add('card'); tip.style.display = 'block'; tip.style.left = ''; tip.style.top = ''; TIP_T = Date.now();
    tip.querySelector('.tip-x').onclick = function () { hideTip(true); };
    if (act) tip.querySelector('.tip-go').onclick = function () { hideTip(true); act.fn(); };
    return;
  }
  tip.classList.remove('card');
  tip.innerHTML = html; tip.style.display = 'block';
  var x = e.clientX + 14, y = e.clientY + 14, w = tip.offsetWidth, h = tip.offsetHeight;
  if (x + w > innerWidth - 8) x = e.clientX - w - 14;
  if (y + h > innerHeight - 8) y = e.clientY - h - 14;

}
function hideTip(force) { if (TOUCH && !force && tip.classList.contains('card')) return; tip.style.display = 'none'; tip.classList.remove('card'); TIPK = null; }

function drawTimeline(el) {
  var vs = EVS;
  var W = Math.max(el.clientWidth - 32, 300), rowH = 24, wide = I.en() && W >= 700;
  var lab = I.en() ? (wide ? Math.min(330, W * 0.42) : Math.min(120, W * 0.32)) : Math.min(190, W * 0.4), H = vs.length * rowH + 30;
  var x0 = lab + 10, x1 = W - 70, lo = 1300, hi = 1950, xu = W - 30;
  var sx = function (yr) { return x0 + (yr - lo) / (hi - lo) * (x1 - x0); };
  var s = '<svg width="' + W + '" height="' + H + '" role="img" aria-label="' + L('齋曆版本時間線', 'Timeline of calendar editions') + '">';
  for (var t = 1300; t <= 1950; t += (W < 500 ? 200 : 50)) s += '<line class="gridl" x1="' + sx(t) + '" x2="' + sx(t) + '" y1="0" y2="' + (H - 22) + '"/>' + (t % 100 === 0 || W >= 900 ? '<text x="' + sx(t) + '" y="' + (H - 6) + '" text-anchor="middle">' + t + '</text>' : '');
  s += '<text x="' + xu + '" y="' + (H - 6) + '" text-anchor="middle">' + L('未定', 'n.d.') + '</text>';
  vs.forEach(function (v, i) {
    var y = i * rowH + 14, cx = v.year ? sx(v.year) : xu;
    var nm = wide ? NT(v.short) : v.short, cap = wide ? 40 : I.en() ? 14 : 10;
    var name = (nm.length > cap ? nm.slice(0, cap - 1) + '…' : nm) + ' ' + v.when.replace(/^(\d{4}).*$/, '$1');
    s += '<g data-v="' + v.i + '" style="cursor:pointer">' +
      '<rect x="0" y="' + (y - 11) + '" width="' + W + '" height="' + rowH + '" fill="transparent"/>' +
      '<text x="' + lab + '" y="' + (y + 4) + '" text-anchor="end" style="font-size:' + (wide ? 11.5 : 12) + 'px;' + (v.yuxia ? 'fill:var(--ink);font-weight:600' : '') + '">' + esc(name) + ' (' + v.n + ')</text>' +
      '<line class="gridl" x1="' + x0 + '" x2="' + cx + '" y1="' + y + '" y2="' + y + '" stroke-dasharray="2 3"/>' +
      '<circle cx="' + cx + '" cy="' + y + '" r="6" stroke-width="2" style="fill:' + (v.yuxia ? 'var(--v1)' : 'var(--surface)') + ';stroke:' + (v.yuxia ? 'var(--surface)' : 'var(--v1)') + '"/></g>';
  });
  s += '</svg>';
  el.innerHTML = s;
  el.querySelectorAll('g[data-v]').forEach(function (g) {
    var html = vInfo(ED.versions[+g.getAttribute('data-v')]);
    g.addEventListener('mousemove', function (e) { showTip(e, html); });
    g.addEventListener('mouseleave', hideTip);
    g.addEventListener('click', function () { hideTip(); location.hash = 'ev/' + g.getAttribute('data-v'); });
  });
}

function drawTopBar(el) {
  var rows = Object.keys(byG).map(function (id) {
    var b = byG[id], c = { '明確': 0, '可推斷': 0, '僅日期巧合': 0 };
    b.prac.forEach(function (p) { if (c[p.ev] != null) c[p.ev]++; });
    return { id: id, c: c, t: b.prac.length };
  }).filter(function (r) { return r.t > 0; }).sort(function (a, b) { return b.t - a.t; }).slice(0, 15);
  var W = Math.max(el.clientWidth - 32, 300), rowH = 24, lab = I.en() ? Math.min(190, W * 0.45) : 90, H = rows.length * rowH + 24;
  var max = rows[0].t, sx = function (n) { return n / max * (W - lab - 40); };
  var keys = ['明確', '可推斷', '僅日期巧合'], fills = ['var(--ev1)', 'var(--ev2)', 'var(--ev3)'];
  var s = '<svg width="' + W + '" height="' + H + '" role="img" aria-label="' + L('實踐記錄最多的神明', 'Deities with the most practice records') + '">';
  rows.forEach(function (r, i) {
    var y = i * rowH + 4, x = lab;
    s += '<text x="' + (lab - 8) + '" y="' + (y + 14) + '" text-anchor="end" style="fill:var(--ink);font-size:' + (I.en() ? 12 : 13) + 'px">' + esc(NT(gName(r.id))) + '</text>';
    keys.forEach(function (k, j) {
      var w = sx(r.c[k]); if (!w) return;
      s += '<rect data-g="' + r.id + '" x="' + x + '" y="' + y + '" width="' + Math.max(w - 2, 1) + '" height="16" rx="3" style="fill:' + fills[j] + ';cursor:pointer"/>';
      x += w;
    });
    s += '<text x="' + (x + 4) + '" y="' + (y + 13) + '">' + r.t + '</text>';
  });
  s += '</svg>';
  el.innerHTML = s;
  el.querySelectorAll('rect').forEach(function (rc) {
    var r = rows.filter(function (q) { return q.id === rc.getAttribute('data-g'); })[0];
    rc.addEventListener('mousemove', function (e) {
      showTip(e, '<b>' + N(gName(r.id)) + '</b><br>' + C('明確') + ' ' + r.c['明確'] + ' · ' + C('可推斷') + ' ' + r.c['可推斷'] + ' · ' + C('僅日期巧合') + ' ' + r.c['僅日期巧合'] + '<br><span class="muted">' + L('點擊看檔案', 'Click for profile') + '</span>');
    });
    rc.addEventListener('mouseleave', hideTip);
    rc.addEventListener('click', function () { hideTip(); location.hash = 'g/' + r.id; });
  });
}

function drawStrip(el, b) {
  var W = Math.max(el.clientWidth - 32, 280), H = 96, x0 = 16, x1 = W - 16, lo = 1500, hi = 1950;
  var sx = function (y) { return x0 + (y - lo) / (hi - lo) * (x1 - x0); };
  var s = '<svg width="' + W + '" height="' + H + '" role="img" aria-label="' + L('年代分佈', 'Distribution over time') + '">';
  for (var t = 1500; t <= 1950; t += 50) s += '<line class="gridl" x1="' + sx(t) + '" x2="' + sx(t) + '" y1="6" y2="72"/><text x="' + sx(t) + '" y="88" text-anchor="middle">' + t + '</text>';
  s += '<text x="' + x0 + '" y="22" style="font-size:10px">' + L('實踐', 'Practice') + '</text><text x="' + x0 + '" y="56" style="font-size:10px">' + L('申報', 'Shenbao') + '</text>';
  var pts = [];
  b.prac.forEach(function (p) { var y = +p.year; if (y >= lo && y <= hi) pts.push({ x: sx(y), y: 30, weak: p.ev === NOFAST, t: p.id + ' ' + p.year + '｜' + NT(p.place) + '｜' + C(p.ev) + '｜' + NT(p.wt) }); });
  b.sb.forEach(function (r) { var y = +String(r.date).slice(0, 4); if (y) pts.push({ x: sx(y), y: 62, sb: 1, t: r.date + '｜' + NT(r.title) + '｜' + NT(r.place) }); });
  pts.forEach(function (p, i) {
    var jit = ((i * 37) % 9) - 4;
    s += '<circle data-i="' + i + '" cx="' + p.x + '" cy="' + (p.y + jit) + '" r="5" stroke-width="2" style="' +
      (p.sb ? 'fill:var(--v2);stroke:var(--surface)' : p.weak ? 'fill:var(--surface);stroke:var(--ev1)' : 'fill:var(--ev1);stroke:var(--surface)') + '"/>';
  });
  s += '</svg>';
  el.innerHTML = s;
  el.querySelectorAll('circle').forEach(function (c) {
    var p = pts[+c.getAttribute('data-i')];
    c.addEventListener('mousemove', function (e) { showTip(e, esc(p.t)); });
    c.addEventListener('mouseleave', hideTip);
  });
}

  try { sessionStorage.setItem('zhai-demo-on', String(DEMO.i)); } catch (e) {}
  document.body.classList.add('demo-on');
  closeDay(); closeCmp(true); hcHide(); hideTip(true);
  var u = s[DEMO.i].url || '#overview';
  if (location.hash === u) route(); else location.hash = u.replace(/^#/, '');
  demoRender();
}
function demoRender() {
  var s = demoSteps(), st = s[DEMO.i] || {}, b = demoBar();
  b.hidden = false;
  b.innerHTML = '<button type="button" class="db-nav" data-dm="-1" aria-label="' + L('上一步', 'Previous step', 'Étape précédente') + '">←</button>' +
    '<div class="db-cap"><span class="db-n">' + (DEMO.i + 1) + ' / ' + s.length + '</span>' + esc(demoCap(st)) + '</div>' +
    '<button type="button" class="db-nav" data-dm="1" aria-label="' + L('下一步', 'Next step', 'Étape suivante') + '">→</button>' +
    '<div class="db-tools"><button type="button" data-dm="edit">' + L('編輯步驟', 'Edit steps', 'Modifier les étapes') + '</button><button type="button" data-dm="fs">' + L('全屏', 'Full screen', 'Plein écran') + '</button><button type="button" data-dm="x">' + L('退出演示', 'Exit', 'Quitter') + '</button></div>';
  b.querySelectorAll('[data-dm]').forEach(function (x) { x.onclick = function () { var a = x.getAttribute('data-dm'); if (a === 'x') demoExit(); else if (a === 'edit') demoEdit(); else if (a === 'fs') { try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); } catch (e) {} } else demoGo(DEMO.i + +a); }; });
}
function demoExit() {
  DEMO.on = false; try { sessionStorage.removeItem('zhai-demo-on'); } catch (e) {}
  document.body.classList.remove('demo-on'); var b = document.getElementById('demobar'); if (b) b.hidden = true;
  var ed = document.getElementById('demoedit'); if (ed) ed.hidden = true;
  if (document.fullscreenElement) try { document.exitFullscreen(); } catch (e) {}
}
addEventListener('keydown', function (e) {
  if (!DEMO.on || /input|textarea|select/i.test(document.activeElement.tagName)) return;
  var ed = document.getElementById('demoedit'); if (ed && !ed.hidden) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || (e.key === ' ' && !e.shiftKey)) { e.preventDefault(); demoGo(DEMO.i + 1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp' || (e.key === ' ' && e.shiftKey)) { e.preventDefault(); demoGo(DEMO.i - 1); }
  else if (e.key === 'Escape' && !document.querySelector('#daypanel:not([hidden]), #cmppanel:not([hidden])')) demoExit();
});
function demoEdit() {
  var box = document.getElementById('demoedit');
  if (!box) { box = document.createElement('div'); box.id = 'demoedit'; box.className = 'demoedit'; box.setAttribute('role', 'dialog'); document.body.appendChild(box); }
  box.hidden = false;
  var s = demoSteps(), lk = I.lang;
  box.innerHTML = '<div class="de-box"><div class="cp-head"><div class="cp-title">' + L('編輯演示步驟', 'Edit presentation steps', 'Modifier les étapes') + '</div><button type="button" class="dp-close" data-de="x" aria-label="' + L('關閉', 'Close') + '">✕</button></div>' +
    '<p class="small muted">' + L('說明文字按當前界面語言編輯（現在是', 'Captions are edited in the current interface language (now ', 'Les légendes sont modifiées dans la langue de l’interface (actuellement ') + { zh: '中文', en: 'English', fr: 'français' }[lk] + L('）。「加入當前畫面」會把頁面現在的樣子（含篩選、聚焦、年代、打開的「這一天」）存爲新的一步。改動存在本瀏覽器裏；要讓別的電腦也用，點「導出」把內容交給維護者貼進 demo.js。',
      '). “Add current view” saves the page as it is now (filters, focus, years, open “this day”) as a new step. Changes are stored in this browser; to use them elsewhere, “Export” and paste into demo.js.',
      '). « Ajouter la vue actuelle » enregistre la page telle qu’elle est (filtres, sélection, années, « ce jour » ouvert) comme nouvelle étape. Les modifications restent dans ce navigateur ; pour les utiliser ailleurs, « Exporter » et coller dans demo.js.') + '</p><ol class="de-list">' +
    s.map(function (st, i) {
      return '<li><div class="de-row"><textarea data-i="' + i + '" rows="2">' + esc(demoCap(st) || '') + '</textarea><div class="de-btns"><button type="button" data-de="go" data-i="' + i + '">' + L('看', 'View', 'Voir') + '</button><button type="button" data-de="up" data-i="' + i + '"' + (i ? '' : ' disabled') + '>↑</button><button type="button" data-de="dn" data-i="' + i + '"' + (i < s.length - 1 ? '' : ' disabled') + '>↓</button><button type="button" data-de="rm" data-i="' + i + '">' + L('刪除', 'Delete', 'Supprimer') + '</button></div></div><div class="small muted de-url">' + esc(st.url) + '</div></li>';
    }).join('') + '</ol><div class="de-foot"><button type="button" data-de="add">' + L('＋ 加入當前畫面', '+ Add current view', '+ Ajouter la vue actuelle') + '</button><button type="button" data-de="export">' + L('導出', 'Export', 'Exporter') + '</button><button type="button" data-de="reset">' + L('恢復默認步驟', 'Restore default steps', 'Rétablir les étapes par défaut') + '</button></div></div>';
  var put = function (s2) { demoSave(s2); demoEdit(); if (DEMO.on) demoRender(); };
  box.querySelectorAll('textarea').forEach(function (ta) { ta.oninput = function () { var s2 = demoSteps(), st = s2[+ta.getAttribute('data-i')]; st[lk] = ta.value; demoSave(s2); if (DEMO.on) demoRender(); }; });
  box.querySelectorAll('[data-de]').forEach(function (x) {
    x.onclick = function () {
      var a = x.getAttribute('data-de'), i = +x.getAttribute('data-i'), s2 = demoSteps();
      if (a === 'x') { box.hidden = true; return; }
      if (a === 'go') { box.hidden = true; demoGo(i); return; }
      if (a === 'up' && i > 0) { s2.splice(i - 1, 0, s2.splice(i, 1)[0]); put(s2); }
      if (a === 'dn' && i < s2.length - 1) { s2.splice(i + 1, 0, s2.splice(i, 1)[0]); put(s2); }
      if (a === 'rm') { s2.splice(i, 1); put(s2); }
      if (a === 'add') { var st = { url: shareURL(false) }; st[lk] = document.title; s2.splice(DEMO.on ? DEMO.i + 1 : s2.length, 0, st); put(s2); }
      if (a === 'reset') { try { localStorage.removeItem('zhai-demo'); } catch (e) {} demoEdit(); if (DEMO.on) demoGo(0); }
      if (a === 'export') copyText('window.ZHAI_DEMO = ' + JSON.stringify(demoSteps(), null, 1) + ';', L('已複製步驟，可貼進 demo.js', 'Steps copied (paste into demo.js)', 'Étapes copiées (à coller dans demo.js)'));
    };
  });
}

// ---------- 路由 ----------
function route(ev) {
  hideTip(true); hcHide(); closeDay();
  if (window.ZhaiRing) ZhaiRing.hideTip();
  var hsh = location.hash.replace(/^#/, '') || 'overview', qi = hsh.indexOf('?'), qs = null, after = {};
  if (qi >= 0) { qs = qsParse(hsh.slice(qi + 1)); hsh = hsh.slice(0, qi) || 'overview'; history.replaceState(null, '', location.pathname + location.search + '#' + hsh); }   // 帶狀態的鏈接：讀入後從地址欄去掉
  var v = hsh.split('/')[0];
  if (qs) { after = shareApply(v, qs); ev = null; }
  if (v === 'cmp') { history.replaceState(null, '', location.pathname + location.search + '#kin' + hsh.slice(3)); hsh = 'kin' + hsh.slice(3); v = 'kin'; }   // 舊網址 #cmp/甲/乙
  var ab = v === 'kin' ? hsh.split('/').slice(1) : [], kinFast = !!(ev && ev.type === 'hashchange') && v === 'kin' && LAST_V === 'kin', keepY = false;
  LAST_V = v;
  if (v !== 'kin' || !ab[0]) closeCmp(true);
  M.scrolled = 0; EDF.scrolled = 0; TIME_HOOK = null; timeStop(true);
  var navV = v === 'g' ? 'gods' : (v === 'ed' || v === 'ev') ? 'editions' : v;
  document.querySelectorAll('#nav a').forEach(function (a) { a.classList.toggle('on', a.getAttribute('data-v') === navV); });
  menuLabel(); menuOpen(false);
  if (v === 'g') viewGod(hsh.split('/')[1], hsh.split('/')[2]);
  else if (v === 'fit') { if (hsh.split('/')[1]) FIT.q = decodeURIComponent(hsh.split('/')[1]); viewFit(); }
  else if (v === 'matrix') viewMatrix();
  else if (v === 'editions') viewEditions();
  else if (v === 'ed') viewEdGod(decodeURIComponent(hsh.slice(3)));
  else if (v === 'ev') viewEdVersion(hsh.split('/')[1], hsh.split('/')[2]);
  else if (v === 'calendar') viewCalendar();
  else if (v === 'gods') viewGods();
  else if (v === 'gaps') viewGaps();
  else if (v === 'context') viewContext();
  else if (v === 'ring') viewRing(hsh.split('/')[1]);
  else if (v === 'spread') viewSpread();
  else if (v === 'kin') { if (!(kinFast && app.querySelector('.kin'))) viewKinship(); else keepY = true; }
  else viewOverview();
  if (!keepY) window.scrollTo(0, 0);
  if (ab[0]) openCmp(ab[0], ab[1]);
  if (v === 'ring' && RING_SET && window.ZhaiRing) { var rs = RING_SET; RING_SET = null; setTimeout(function () { ZhaiRing.set(rs); }, 30); }
  if (after.day && after.day[1]) openDay(after.day[0], after.day[1]);
  if (after.play && (v === 'fit' || v === 'spread')) setTimeout(timePlay, 400);
  if (DEMO.on) demoRender();
  decorate();
}
var LAST_V = '';
window.addEventListener('hashchange', route);
var rt; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(function () { var v = location.hash; if (!v || v === '#overview' || /^#g\/[^\/]+$/.test(v)) route(); }, 200); });

    'Data: ' + esc(D.source) + '. ' + (D.noQuotes ? 'Public version: quotations from practice records, the <i>Shenbao</i>, records of customs and calendar texts read in the Shidian guji 識典古籍 database are omitted; only IDs, summaries and codes are given. ' : '') +
    'No entry has yet been checked against the original book; quotations mostly follow electronic texts or database full text, so verify before citing. Proper names are given in pinyin with Chinese characters (pinyin generated automatically). Dates are lunar month/day. Research notes and summaries remain in Chinese.', 'Données : ' + esc(D.source) + '. ' + (D.noQuotes ? 'Version publique : les citations des témoignages de pratique, du <i>Shenbao</i>, des descriptions de coutumes et des textes de calendriers lus dans la base Shidian guji 識典古籍 sont omises ; seuls les identifiants, résumés et codes sont donnés. ' : '') + 'Aucune entrée n’a encore été vérifiée sur l’ouvrage original ; les citations suivent le plus souvent des textes électroniques ou le texte intégral des bases de données : à vérifier avant de citer. Les noms propres sont donnés en pinyin avec les caractères chinois (pinyin généré automatiquement). Les dates sont lunaires, au format mois/jour. Les notes de recherche et les résumés restent en chinois.');
  document.getElementById('foot').innerHTML += ' <span class="fontkey">' + L('<span class="yt">楷體字</span>是史料原文，黑體字是研究者的說明。', '<span class="yt">Kaishu type</span> marks text quoted from the sources; sans-serif type is the researcher’s commentary.', '<span class="yt">Les caractères kaishu</span> signalent le texte cité des sources ; les caractères sans empattement, le commentaire de la recherche.') + '</span>';
}

})();
