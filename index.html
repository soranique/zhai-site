<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --surface-2: #f2f1ed;
  --ink: #0b0b0b;

  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --accent: #8a2b1a;
  --v1: #2a78d6; --v2: #eb6834; --v3: #1baf7a; --v4: #eda100;
  --ev1: #1c5cab; --ev2: #3987e5; --ev3: #86b6ef;
  --hl: #fff3c4;
  --yuan: #f6ebe7; --yuan-line: #dcbcb0;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #242422;
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --accent: #e0846f;
    --v1: #3987e5; --v2: #d95926; --v3: #199e70; --v4: #c98500;
    --ev1: #86b6ef; --ev2: #3987e5; --ev3: #184f95;
    --hl: #4a3f12;
    --yuan: #2c201c; --yuan-line: #5a3a30;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #242422;
  --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --accent: #e0846f;
  --v1: #3987e5; --v2: #d95926; --v3: #199e70; --v4: #c98500;
  --ev1: #86b6ef; --ev2: #3987e5; --ev3: #184f95;
  --hl: #4a3f12;
  --yuan: #2c201c; --yuan-line: #5a3a30;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font: 15px/1.7 "Noto Serif SC", "Songti SC", "SimSun", serif;
}
/* 英文界面：拉丁字母用 Noto Serif，汉字仍用 Noto Serif SC */
html[lang="en"] body { font-family: "Noto Serif", "Noto Serif SC", "Songti SC", "SimSun", serif; }
a { color: var(--accent); }
header.top {
  border-bottom: 1px solid var(--grid); background: var(--surface);
  position: sticky; top: 0; z-index: 10;
}
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px; }
.top .wrap { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding-top: 10px; padding-bottom: 10px; }
.brand { font-weight: 700; font-size: 17px; letter-spacing: .04em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 8px; font-size: 13px; }
nav { display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto; }
nav a {
  text-decoration: none; color: var(--ink-2); padding: 4px 10px; border-radius: 6px; font-size: 14px;
}
nav a.on { background: var(--surface-2); color: var(--ink); font-weight: 600; }
#theme, #lang { background: none; border: 1px solid var(--grid); color: var(--ink-2); border-radius: 6px; padding: 3px 8px; cursor: pointer; font: inherit; font-size: 13px; }
main { padding: 24px 0 64px; }

h2 { font-size: 19px; margin: 32px 0 10px; }
h3 { font-size: 16px; margin: 22px 0 8px; }
.lede { color: var(--ink-2); max-width: 760px; margin: 0 0 20px; }
.card { background: var(--surface); border: 1px solid var(--grid); border-radius: 10px; padding: 16px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.tile .n { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }
.tile .l { color: var(--ink-2); font-size: 13px; }

.muted { color: var(--muted); }
.small { font-size: 13px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 0 0 12px; }
.controls input[type=search], .controls select {
  font: inherit; font-size: 14px; padding: 5px 9px; border: 1px solid var(--axis); border-radius: 6px;
  background: var(--surface); color: var(--ink); min-width: 0;
}
.controls label { font-size: 14px; color: var(--ink-2); display: inline-flex; gap: 5px; align-items: center; }
.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--grid); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
.scroll table { min-width: 760px; }
th, td { text-align: left; vertical-align: top; padding: 7px 10px; border-bottom: 1px solid var(--grid); }
th { font-weight: 600; color: var(--ink-2); background: var(--surface-2); position: sticky; top: 0; white-space: nowrap; }
th.sortable { cursor: pointer; }
th.sortable:hover { color: var(--ink); }
tr.row { cursor: pointer; }
tr.row:hover td { background: var(--surface-2); }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: 0; }
.v-L0 { --c: var(--v1); } .v-L1 { --c: var(--v2); } .v-L2 { --c: var(--v3); } .v-L3 { --c: var(--v4); }
.v-W001 { --c: var(--v1); } .v-W014 { --c: var(--v2); } .v-W063 { --c: var(--v3); } .v-W085 { --c: var(--v4); }
.sw.v { background: var(--c); }
.cell-v { border-left: 3px solid var(--c); padding-left: 7px; }
.cell-empty { color: var(--axis); }
.tag { display: inline-block; font-size: 12px; padding: 0 6px; border-radius: 4px; border: 1px solid var(--axis); color: var(--ink-2); margin: 0 4px 2px 0; white-space: nowrap; }
.tag.strong { border-color: var(--ink-2); color: var(--ink); }
.flag { color: var(--accent); font-size: 12px; white-space: nowrap; }
/* calendar */
.cal { display: grid; grid-template-columns: 64px repeat(var(--lanes), minmax(150px, 1fr)); min-width: calc(64px + var(--lanes) * 150px); }
.cal > div { border-bottom: 1px solid var(--grid); border-right: 1px solid var(--grid); padding: 6px; }
.cal .hd { background: var(--surface-2); font-weight: 600; font-size: 13px; position: sticky; top: 0; }
.cal .mo { font-weight: 600; color: var(--ink-2); font-size: 14px; }
.chip {
  display: inline-block; font-size: 12px; line-height: 1.5; padding: 1px 6px; margin: 2px 3px 2px 0;
  border-radius: 4px; background: var(--surface-2); border-left: 3px solid var(--c, var(--axis)); cursor: pointer;
  color: var(--ink);
}
.chip.p { border-left: 3px solid var(--ink-2); }
.chip.p.weak { border-left-style: dotted; color: var(--ink-2); }
.chip.hl { background: var(--hl); outline: 1px solid var(--ink-2); }
.chip.lk::after { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--v3); margin-left: 4px; vertical-align: middle; }
.chip.lk.dev::after { background: var(--v4); }
.tag.fit { border-color: var(--v3); color: var(--ink); }
.tag.dev { border-color: var(--v4); color: var(--ink); background: color-mix(in srgb, var(--v4) 14%, transparent); }
.plk { white-space: nowrap; margin-right: 6px; font-size: 12px; }
.fit td { vertical-align: top; }
.fitg { cursor: pointer; }
.fitg:hover td { background: var(--surface-2); }
.fitg .tw { display: inline-block; width: 1em; color: var(--muted); }
.fitg.open td { background: var(--surface-2); font-weight: 600; }
.fitg.open td .small, .fitg.open td .muted { font-weight: 400; }
.fitd td { border-top: none; }
.fitd td:first-child { border-left: 3px solid var(--grid); }
.fday { display: inline-block; margin-right: 10px; white-space: nowrap; }
.rec.jump { background: var(--hl); transition: background 1.5s; }
/* ---- 流通地图 ---- */
.spread { --sea:#dfe8ee; --land:#f8f6f0; --coast:#aeab9f; --f1:#2a78d6; --f2:#eb6834; --f3:#1baf7a; --f5:#7a5bc4; --f6:#b0802a; --f0:#898781; --doc:var(--ink); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .spread { --sea:#1a1f22; --land:#23231f; --coast:#4a4944; --f1:#5b9ae6; --f2:#f08a5d; --f3:#3cc996; --f5:#a58ce0; --f6:#d4a54d; } }
:root[data-theme="dark"] .spread { --sea:#1a1f22; --land:#23231f; --coast:#4a4944; --f1:#5b9ae6; --f2:#f08a5d; --f3:#3cc996; --f5:#a58ce0; --f6:#d4a54d; }
.spread .sgrid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
@media (max-width: 900px) { .spread .sgrid { grid-template-columns: 1fr; } }
.spread svg.smap { width: 100%; height: auto; display: block; border-radius: 8px; }
.spread .sea { fill: var(--sea); } .spread .land { fill: var(--land); stroke: var(--coast); stroke-width: .7; }
.spread .grat { fill: none; stroke: var(--grid); stroke-width: .5; stroke-dasharray: 2 3; }
.spread .ibox { fill: var(--sea); stroke: var(--ink-2); stroke-width: 1; } .spread .ireg { fill: none; stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 3 2; } .spread .ititle { font-size: 12px; fill: var(--ink-2); }
.spread .sedge { fill: none; stroke-width: 2.2; cursor: pointer; }
.spread .sedge.inf { stroke-dasharray: 2 4; stroke-width: 2; } .spread .sedge.fam { stroke-dasharray: 7 5; }
.spread .sedge:hover, .spread .sedge.hl { stroke-width: 4; }
.spread .hit { fill: none; stroke: transparent; stroke-width: 14; cursor: pointer; }
.spread .spt { cursor: pointer; } .spread .spt text { font-size: 13px; fill: var(--ink); paint-order: stroke; stroke: var(--page); stroke-width: 3px; stroke-linejoin: round; }
.spread .spt .print { fill: var(--accent); stroke: var(--surface); stroke-width: 1.5; } .spread .spt .attr { fill: var(--surface); stroke: var(--accent); stroke-width: 2; } .spread .spt .acq { fill: var(--ink); stroke: var(--surface); stroke-width: 1.5; }
.spread .dim { opacity: .15; }
.spread .yr { font-size: 10.5px; fill: var(--ink-2); paint-order: stroke; stroke: var(--page); stroke-width: 3px; }
.spread .slg { display: grid; grid-template-columns: 34px 1fr; gap: 4px 8px; align-items: center; font-size: 13px; margin-bottom: 10px; }
.spread .slg svg, .spread .sflt svg { width: 34px; height: 16px; flex: none; }
.spread .sflt label { display: flex; gap: 6px; align-items: center; font-size: 13px; margin: 3px 0; cursor: pointer; }
.spread .ssw { display: inline-block; width: 22px; height: 0; border-top: 3px dashed; vertical-align: middle; }
.spread ul.sev { list-style: none; padding: 0; margin: 0; font-size: 13px; }
.spread ul.sev li { padding: 6px 0; border-top: 1px solid var(--grid); cursor: pointer; }
.spread ul.sev li:hover { background: var(--surface-2); }
.spread .st { font-size: 11px; border: 1px solid var(--axis); border-radius: 4px; padding: 0 4px; margin-left: 4px; color: var(--ink-2); white-space: nowrap; }

.chip .dd { color: var(--muted); margin-right: 3px; }
/* profile */
.prof-head { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; }
.prof-head h1 { margin: 0; }
.kv { display: grid; grid-template-columns: 90px 1fr; gap: 4px 12px; font-size: 14px; margin-top: 10px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.rec { border-top: 1px solid var(--grid); padding: 10px 0; }
.rec:first-child { border-top: 0; }
.rec .meta { font-size: 13px; color: var(--ink-2); }
.rec .q { margin: 6px 0 2px; padding-left: 10px; border-left: 2px solid var(--axis); color: var(--ink); font-size: 14px; }
.rec .nt { font-size: 13px; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
.godlist { columns: 4 160px; font-size: 14px; }
.godlist a { display: block; text-decoration: none; color: var(--ink); padding: 1px 0; }
.godlist a span { color: var(--muted); font-size: 12px; }
svg text { fill: var(--ink-2); font-size: 11px; font-family: inherit; }
svg .axis { stroke: var(--axis); }
svg .gridl { stroke: var(--grid); }
.tip {
  position: fixed; pointer-events: none; z-index: 50; background: var(--surface); color: var(--ink);
  border: 1px solid var(--axis); border-radius: 8px; padding: 8px 10px; font-size: 13px; max-width: 300px;
  box-shadow: 0 4px 16px rgba(0,0,0,.12); display: none;
}
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink-2); margin: 6px 0 10px; }
.legend .sw.e1 { background: var(--ev1); } .legend .sw.e2 { background: var(--ev2); } .legend .sw.e3 { background: var(--ev3); }
.gap li { margin-bottom: 6px; }
/* 斋期日历：版本选择 */
.vpick { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
.vpick button { font: inherit; font-size: 12.5px; background: none; border: 1px solid var(--axis); color: var(--ink-2); border-radius: 999px; padding: 2px 10px; cursor: pointer; }
.vpick button[aria-pressed="true"] { border-color: var(--ink-2); color: var(--ink); background: var(--surface-2); font-weight: 600; }
.vpick button:disabled { opacity: .45; cursor: default; }
.ringpick select { max-width: 100%; }
/* 诸本对照 */
table.edm { min-width: 0; width: auto; font-size: 13px; }
table.edm th.edc { vertical-align: bottom; padding: 6px 2px; text-align: center; white-space: normal; }
table.edm th.edc a { display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: var(--ink-2); }
table.edm th.edc .yr { font-size: 11px; color: var(--muted); }
table.edm th.edc .vt { writing-mode: vertical-rl; font-size: 12px; max-height: 10em; overflow: hidden; line-height: 1.2; }
table.edm td.edc { text-align: center; padding: 5px 3px; min-width: 44px; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.edm .ox { background: var(--surface-2); }
table.edm td.dv { color: var(--accent); font-weight: 600; }
table.edm .xn { font-size: 10px; color: var(--muted); margin-left: 1px; }
table.edm .edn { position: sticky; left: 0; background: var(--surface); z-index: 1; min-width: 130px; max-width: 220px; }
table.edm thead .edn { z-index: 2; background: var(--surface-2); }
.morebtn { font: inherit; font-size: 14px; background: none; border: 1px solid var(--axis); color: var(--ink-2); border-radius: 6px; padding: 5px 14px; cursor: pointer; }
.morebtn[hidden] { display: none; }
.gap .cnt { font-weight: 700; font-variant-numeric: tabular-nums; }
/* 源流与框架 */
.flow { display: grid; grid-template-columns: 150px repeat(5, minmax(120px, 1fr)) 26px 190px; min-width: 1000px; padding: 16px; row-gap: 14px; }
.flow .ph { font-weight: 700; text-align: center; font-size: 15px; padding-bottom: 2px; }
.flow .ph.y { color: var(--accent); }
.flow .lane { font-size: 12px; line-height: 1.5; color: var(--muted); display: flex; flex-direction: column; justify-content: center; padding-right: 10px; }
.flow .lane b { color: var(--ink); font-size: 14px; }
.flow .cell { display: flex; align-items: stretch; min-height: 76px; position: relative; }
.flow .bx { flex: 1; display: flex; flex-direction: column; justify-content: center; text-align: center; font-size: 12.5px; line-height: 1.55; color: var(--ink-2); background: var(--surface); border: 1px solid var(--axis); border-radius: 8px; padding: 8px 8px; }
.flow .bx b { color: var(--ink); font-size: 13.5px; }
.flow .bx.y { background: var(--yuan); border-color: var(--yuan-line); }
.flow .bx.q { background: transparent; border-style: dashed; }
.flow .ln, .flow .st { flex: 1; position: relative; min-width: 0; }
.flow .st { flex: 0 0 22px; }
.flow .ln::before, .flow .st::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 2px solid var(--accent); }
.flow .st::before { right: 7px; }
.flow .st::after { content: ""; position: absolute; right: 0; top: calc(50% - 5px); border-left: 8px solid var(--accent); border-top: 6px solid transparent; border-bottom: 6px solid transparent; transform: translateY(1px); }
.flow .d::before { border-top-style: dashed; border-top-color: var(--muted); }
.flow .st.d::after { border-left-color: var(--muted); }
.flow .note { position: absolute; left: 0; right: 0; bottom: -2px; text-align: center; font-size: 11.5px; line-height: 1.3; color: var(--accent); background: transparent; }
.flow .note.m { color: var(--muted); }
.flow .qing { grid-column: 8; display: flex; flex-direction: column; justify-content: center; text-align: center; background: var(--ink); color: var(--page); border-radius: 10px; padding: 18px 12px; font-size: 13.5px; line-height: 1.9; }
.flow .qing b { font-size: 17px; line-height: 1.6; }
.flow .qing .s { opacity: .75; font-size: 12.5px; }
.lg { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 13px; color: var(--ink-2); margin: 8px 0 0; align-items: center; }
.lg i { display: inline-block; width: 30px; vertical-align: middle; margin-right: 6px; border-top: 2px solid var(--accent); }
.lg i.d { border-top: 2px dashed var(--muted); }
.lg i.bxq { width: 24px; height: 14px; border: 1px dashed var(--muted); border-radius: 3px; }
.lg i.bxy { width: 24px; height: 14px; border: 1px solid var(--yuan-line); background: var(--yuan); border-radius: 3px; }
.fw { display: grid; grid-template-columns: 170px 1fr 1fr 250px; gap: 12px; }
.fw .layer { border-radius: 10px; padding: 14px; display: contents; }
.fw .lab { display: flex; flex-direction: column; justify-content: center; font-size: 13px; color: var(--muted); line-height: 1.6; padding: 10px 0 10px 12px; border-left: 4px solid var(--c); }
.fw .lab b { color: var(--ink); font-size: 17px; }
.fw .dim { background: var(--surface); border: 1px solid var(--grid); border-top: 3px solid var(--c); border-radius: 8px; padding: 12px 16px; font-size: 14px; color: var(--ink-2); }
.fw .dim b { display: block; color: var(--ink); font-size: 15.5px; margin-bottom: 2px; }
.fw .dim .s { font-size: 12.5px; color: var(--muted); }
.fw .ax { grid-column: 4; grid-row: 1 / span 3; background: var(--ink); color: var(--page); border-radius: 10px; padding: 20px 18px; font-size: 14px; line-height: 1.8; display: flex; flex-direction: column; justify-content: center; }
.fw .ax b.t { font-size: 18px; }
.fw .ax .s { opacity: .75; font-size: 13px; }
.units { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 18px; }
.units .lab0 { font-weight: 700; font-size: 16px; min-width: 170px; }
.units .u { background: var(--surface); border: 1px solid var(--grid); border-radius: 8px; padding: 10px 16px; text-align: center; font-size: 13px; color: var(--ink-2); flex: 1 1 180px; }
.units .u b { display: block; color: var(--ink); font-size: 15px; }
.units .arr { color: var(--muted); font-size: 13px; white-space: nowrap; }
.swipe { display: none; }
@media (max-width: 1040px) { .swipe { display: block; } }
@media (max-width: 760px) {
  .fw { grid-template-columns: 1fr; }
  .fw .ax { grid-column: auto; grid-row: auto; }
  .units .arr { display: none; }
}
footer { color: var(--muted); font-size: 12px; border-top: 1px solid var(--grid); padding: 16px 0 32px; }
@media (max-width: 640px) {
  h1 { font-size: 22px; }
  .tile .n { font-size: 24px; }
  nav { margin-left: 0; }
  .kv { grid-template-columns: 70px 1fr; }
}
</style>

      <a href="#gaps" data-v="gaps" data-en="Gaps">缺口</a>
    </nav>
    <button id="theme" type="button" aria-label="切换深浅色" data-en="Theme">深浅色</button>
    <button id="lang" type="button" aria-label="Switch to English">EN</button>
  </div>
</header>
<main class="wrap" id="app"></main>
<footer class="wrap" id="foot"></footer>
<div class="tip" id="tip"></div>
<script src="i18n.js?v=6ad45e7c"></script>
<script src="data.js?v=08ee0934"></script>

<script src="spread-data.js?v=002f7724"></script>
<script src="ring.js?v=18077e5a"></script>
<script>
(function () {
'use strict';
var D = window.ZHAI;
var app = document.getElementById('app');
var tip = document.getElementById('tip');

// ---------- 语言 ----------
var I = window.ZhaiI18n, L = I.L, N = I.N, NT = I.NT, C = I.C, DT = I.D;
I.addPinyin(D.py, D.pyTitle);
if (window.ZHAI_RING) I.addPinyin(window.ZHAI_RING.py, window.ZHAI_RING.pyTitle);
document.getElementById('lang').onclick = function () { I.set(I.en() ? 'zh' : 'en'); footer(); route(); };

// ---------- 主题 ----------
var themeBtn = document.getElementById('theme');
try { var saved = localStorage.getItem('zhai-theme'); if (saved) document.documentElement.setAttribute('data-theme', saved); } catch (e) {}
themeBtn.onclick = function () {
  var cur = document.documentElement.getAttribute('data-theme');
  var dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  var next = dark ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('zhai-theme', next); } catch (e) {}
};

// ---------- 数据索引 ----------
var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
var G = {}; D.deities.forEach(function (g) { G[g.id] = g; });
// 数据库「文献」表登记的斋历文本：只用于列出「尚未取得」者
var V = {}; D.versions.forEach(function (v) { V[v.id] = v; });
function vYear(v) { return v.year ? String(v.year) : (v.date ? C(v.date) : L('年代未定', 'undated')); }
var MISSING = D.versions.filter(function (v) { return /未取得/.test(v.status); });

// 斋历：「玉匣記版本对比」工作簿是唯一来源；神明与斋库神明 ID（ZS###，2026-10-29 前写作 G###）的对应来自神明总表的「斋库神明ID（ZS）」栏（未核者用候选并标「待核」）
// 注意：工作簿里的「神明编码（G####）」（如 G0303）是研究者自己的神明编码，与 ZS### 是两套编号
var ED = window.ZHAI_ED || { versions: [], entries: [], norms: {}, cmap: {}, py: {}, pyTitle: {} };
I.addPinyin(ED.py, ED.pyTitle);
var EVS = ED.versions.slice().sort(function (a, b) { return (a.year || 9999) - (b.year || 9999) || a.i - b.i; });
var V0 = (ED.versions.filter(function (v) { return +v.no === 1; })[0] || ED.versions[0] || {}).i;  // 道藏本《玉匣記》1607
var EBYID = {}; ED.entries.forEach(function (e) { if (e.id) EBYID[e.id] = e; });
function normGs(k) { var n = ED.norms[k]; return n && n[0] ? n[0].split(/[\/+]/) : []; }
function normCode(k) { var n = ED.norms[k]; return (n && n[3]) || ''; }
function normPending(k) { var n = ED.norms[k]; return !!(n && n[1]); }
function eKey(e) { var g = normGs(e.k)[0]; return g || (e.k ? 'k:' + e.k : ''); }
function keyHref(k) { return k.indexOf('k:') === 0 ? '#ed/' + encodeURIComponent(k.slice(2)) : '#g/' + k; }

var MN = ['', '正月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '十一月', '十二月'];
function monthName(m) { return I.en() ? I.ord(m) + ' month' : MN[m]; }
function gName(id) { return G[id] ? G[id].name : id; }

var byG = {};
function bucket(id) { return byG[id] || (byG[id] = { ed: {}, nCal: 0, norms: {}, pending: false, prac: [], sb: [], fs: [], cl: [] }); }
ED.entries.forEach(function (e) {
  if (!e.k) return;
  normGs(e.k).forEach(function (g) {
    if (!G[g]) return;
    var b = bucket(g);
    (b.ed[e.v] = b.ed[e.v] || []).push(e); b.nCal++; b.norms[e.k] = 1;
    if (normPending(e.k)) b.pending = true;
  });
});
D.practice.forEach(function (p) { if (p.g) bucket(p.g).prac.push(p); });
// 实践记录 ↔ 斋历条目：实践记录的「对应斋期表条目ID」（旧 C 编号经 cmap 换算）与「对应关系」
var REL_FIT = '贴合', REL_DEV = '存在偏差';
function pCal(p) { return p.cal ? (ED.cmap[p.cal] || p.cal) : ''; }
function isDev(p) { return String(p.rel || '').indexOf(REL_DEV) === 0; }
var PBYE = {};
D.practice.forEach(function (p) { var id = pCal(p); if (id && EBYID[id]) (PBYE[id] = PBYE[id] || []).push(p); });
var LINKED = D.practice.filter(function (p) { return pCal(p) && EBYID[pCal(p)]; });
function relTag(p) {
  if (!p.rel) return '';
  return '<span class="tag' + (p.rel === REL_FIT ? ' fit' : isDev(p) ? ' dev' : '') + '">' + esc(C(p.rel)) + '</span>';
}
// 斋历条目下列出对应的实践记录（点击到该神明档案中的这条记录）
function pLinks(e) {
  var ps = PBYE[e.id]; if (!ps) return '';
  return '<div class="small">' + L('实践：', 'Practice: ') + ps.map(function (p) {
    return '<a class="plk" href="' + (p.g ? '#g/' + p.g + '/' + p.id : '#fit') + '" title="' + esc(DT(p.date) + '｜' + NT(p.wt) + '｜' + C(p.rel)) + '">' + esc(p.id) + (isDev(p) ? L('（偏差）', ' (dev.)') : '') + '</a>';
  }).join('') + '</div>';
}
function eShort(e) { var v = ED.versions[e.v]; return edWhen(v) + ' ' + N(v.short) + ' ' + esc((e.mo || '') + (e.dy || '')); }
D.shenbao.forEach(function (s) { s.gs.forEach(function (g) { bucket(g).sb.push(s); }); });
D.fengsu.forEach(function (s) { s.gs.forEach(function (g) { bucket(g).fs.push(s); }); });
D.classics.forEach(function (s) { s.gs.forEach(function (g) { bucket(g).cl.push(s); }); });
var NOFAST = '仅日期巧合';
function fastPrac(b) { return b.prac.filter(function (p) { return p.ev !== NOFAST; }); }
function firstDated(es) { return (es || []).filter(function (e) { return e.m && e.d; })[0]; }
function godLink(id, txt) { return '<a href="#g/' + id + '">' + (txt ? esc(txt) : N(gName(id))) + '</a>'; }
function vSw(cls) { return '<span class="sw v ' + cls + '"></span>'; }
function aliases(s) { return I.en() ? s.split(/[、，,；;]/).map(function (a) { return N(a.trim()); }).join(', ') : esc(s); }
function zhNote() { return I.en() ? ' <span class="muted small">[Chinese]</span>' : ''; }
function pendTag(b) { return b && b.pending ? ' <span class="flag" title="' + esc(L('神明与斋历条目按名称对应，尚未核对', 'Deity matched to calendar entries by name, not yet verified')) + '">' + L('待核', 'to verify') + '</span>' : ''; }
// 实践记录里「对应斋期表条目ID」（旧 C 编号）→ 工作簿条目ID
function calRef(c) {
  if (!c) return '';
  var id = ED.cmap[c] || c, e = EBYID[id];
  return e ? '<a href="#ev/' + e.v + '">' + esc(id) + '</a> ' + eShort(e) + (id !== c ? ' <span class="muted small">(' + esc(c) + ')</span>' : '') : esc(c);
}
function edHead(v) { return '<th class="edc' + (v.yuxia ? '' : ' ox') + '" title="' + esc(v.sheet) + '"><a href="#ev/' + v.i + '"><span class="yr">' + edWhen(v) + '</span><span class="vt">' + esc(I.en() ? (I.py(v.short) || v.short) : v.short) + '</span></a></th>'; }
function edCell(v, es, cls) {
  if (!es) return '<td class="edc' + (v.yuxia ? '' : ' ox') + ' cell-empty">·</td>';
  var e = firstDated(es);
  return '<td class="edc' + (v.yuxia ? '' : ' ox') + (cls || '') + '" title="' + esc(es.map(function (x) { return x.id + ' ' + (x.mo + x.dy) + ' ' + (x.t || x.g || ''); }).join('\n')) + '">' + (e ? e.m + '/' + e.d : '○') + (es.length > 1 ? '<span class="xn">×' + es.length + '</span>' : '') + '</td>';
}

// ---------- 提示框 ----------
function showTip(e, html) {
  tip.innerHTML = html; tip.style.display = 'block';
  var x = e.clientX + 14, y = e.clientY + 14, w = tip.offsetWidth, h = tip.offsetHeight;
  if (x + w > innerWidth - 8) x = e.clientX - w - 14;
  if (y + h > innerHeight - 8) y = e.clientY - h - 14;
  tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px';
}
function hideTip() { tip.style.display = 'none'; }

// ---------- 视图：概览 ----------
function viewOverview() {
  var strong = D.practice.filter(function (p) { return p.ev !== NOFAST; }).length;
  var linked = Object.keys(byG).filter(function (id) { return byG[id].nCal; }).length;
  var pendN = Object.keys(byG).filter(function (id) { return byG[id].nCal && byG[id].pending; }).length;
  var nDev = LINKED.filter(isDev).length;
  var h = L('<h1>神明在斋期表各版本中的记载</h1>', '<h1>How deities appear across editions of fasting calendars</h1>') +
    L('<p class="lede">以神明为单位，对照：①各版本斋历（「玉匣記版本对比」工作簿）记了哪些神、哪天、要不要斋；②实践记录、《申报》、风俗志中这些神的斋是否真的有人守（「' + esc(D.source) + '」）。</p>',
      '<p class="lede">Organized by deity, the site compares (1) which gods, which days, and whether fasting is required in each edition of the fasting calendars (the comparison workbook of <i>Yuxiaji</i> 玉匣記 editions), and (2) whether people actually kept these gods’ fasts, according to practice records, the <i>Shenbao</i> 申報 and records of local customs (“' + esc(D.source) + '”).</p>') +
    '<div class="tiles">' +
    tile(D.deities.length, L('神明（神明表）', 'Deities (register)'), L('其中 ' + linked + ' 个已接到斋历条目' + (pendN ? '（' + pendN + ' 个待核）' : '（已核）'), linked + ' linked to calendar entries' + (pendN ? ' (' + pendN + ' to verify)' : ' (verified)'))) +
    tile(EVS.length, L('已录入的斋历版本', 'Calendar editions entered'), L('数据库文献表另登记 ' + MISSING.length + ' 种未取得', MISSING.length + ' more registered in the database, not obtained')) +
    tile(ED.entries.length, L('斋历条目', 'Calendar entries'), L('来自版本对比工作簿', 'from the comparison workbook')) +
    tile(D.practice.length, L('实践记录', 'Practice records'), L('其中言及持斋 ' + strong + ' 条', strong + ' mention fasting')) +
    tile('<a href="#fit">' + LINKED.length + '</a>', L('实践记录对上斋历条目', 'Practice records matched to a calendar entry'), L('其中存在偏差 ' + nDev + ' 条；见「实践与斋历」', nDev + ' with deviations; see Practice × calendar')) +
    tile(D.shenbao.length, L('《申报》中有神名的篇目', '<i>Shenbao</i> 申報 articles naming a deity'), '') +
    '</div>';
  h += L('<h2>斋历版本</h2><p class="lede small">按年代排列。实心蓝点是《玉匣記》系统，空心是其他斋历。点圆点进入该版本；逐条对照见 <a href="#editions">诸本对照</a>。年代不详的放在右侧。</p>',
    '<h2>Calendar editions</h2><p class="lede small">In chronological order. Filled blue: the <i>Yuxiaji</i> line; hollow: other calendars. Click a dot to open the edition; for entry-by-entry collation see <a href="#editions">Collated editions</a>. Undated texts sit on the right.</p>') +
    '<div class="card" id="vtl"></div>';
  h += L('<h2>实践记录最多的神明</h2>', '<h2>Deities with the most practice records</h2>') + '<div class="legend">' +
    '<span><span class="sw e1"></span>' + C('明确') + '</span><span><span class="sw e2"></span>' + C('可推断') + '</span><span><span class="sw e3"></span>' + L('仅日期巧合（未言斋）', 'Date coincidence only (no fasting mentioned)') + '</span></div>' +
    '<div class="card" id="topbar"></div>';
  app.innerHTML = h;
  drawTimeline(document.getElementById('vtl'));
  drawTopBar(document.getElementById('topbar'));
}
function tile(n, l, s) { return '<div class="card tile"><div class="n">' + n + '</div><div class="l">' + l + '</div>' + (s ? '<div class="s">' + s + '</div>' : '') + '</div>'; }
function vInfo(v) {
  return '<b>' + N(v.short) + '</b> ' + edWhen(v) + (v.pub && v.pub !== '待填' ? ' · ' + esc(v.pub) : '') + '<br>' + esc(v.title) + '<br>' + esc(C(v.type) || '') + (v.type ? ' · ' : '') + L(v.n + ' 条', v.n + ' entries') +
    (v.date ? '<br><span class="muted">' + esc(v.date) + '</span>' + zhNote() : '');
}

function drawTimeline(el) {
  var vs = EVS;
  var W = Math.max(el.clientWidth - 32, 300), rowH = 24, wide = I.en() && W >= 700;
  var lab = I.en() ? (wide ? Math.min(330, W * 0.42) : Math.min(120, W * 0.32)) : Math.min(190, W * 0.4), H = vs.length * rowH + 30;
  var x0 = lab + 10, x1 = W - 70, lo = 1300, hi = 1950, xu = W - 30;
  var sx = function (yr) { return x0 + (yr - lo) / (hi - lo) * (x1 - x0); };
  var s = '<svg width="' + W + '" height="' + H + '" role="img" aria-label="' + L('斋历版本时间线', 'Timeline of calendar editions') + '">';
  for (var t = 1300; t <= 1950; t += (W < 500 ? 200 : 50)) s += '<line class="gridl" x1="' + sx(t) + '" x2="' + sx(t) + '" y1="0" y2="' + (H - 22) + '"/>' + (t % 100 === 0 || W >= 900 ? '<text x="' + sx(t) + '" y="' + (H - 6) + '" text-anchor="middle">' + t + '</text>' : '');
  s += '<text x="' + xu + '" y="' + (H - 6) + '" text-anchor="middle">' + L('未定', 'n.d.') + '</text>';
  vs.forEach(function (v, i) {
    var y = i * rowH + 14, cx = v.year ? sx(v.year) : xu;
    var nm = wide ? NT(v.short) : v.short, cap = wide ? 40 : I.en() ? 14 : 10;
    var name = (nm.length > cap ? nm.slice(0, cap - 1) + '…' : nm) + ' ' + v.when.replace(/^(\d{4}).*$/, '$1');
    s += '<g data-v="' + v.i + '" style="cursor:pointer">' +
      '<rect x="0" y="' + (y - 11) + '" width="' + W + '" height="' + rowH + '" fill="transparent"/>' +
      '<text x="' + lab + '" y="' + (y + 4) + '" text-anchor="end" style="font-size:' + (wide ? 11.5 : 12) + 'px;' + (v.yuxia ? 'fill:var(--ink);font-weight:600' : '') + '">' + esc(name) + ' (' + v.n + ')</text>' +
      '<line class="gridl" x1="' + x0 + '" x2="' + cx + '" y1="' + y + '" y2="' + y + '" stroke-dasharray="2 3"/>' +
      '<circle cx="' + cx + '" cy="' + y + '" r="6" stroke-width="2" style="fill:' + (v.yuxia ? 'var(--v1)' : 'var(--surface)') + ';stroke:' + (v.yuxia ? 'var(--surface)' : 'var(--v1)') + '"/></g>';
  });
  s += '</svg>';
  el.innerHTML = s;
  el.querySelectorAll('g[data-v]').forEach(function (g) {
    var html = vInfo(ED.versions[+g.getAttribute('data-v')]);
    g.addEventListener('mousemove', function (e) { showTip(e, html); });
    g.addEventListener('mouseleave', hideTip);
    g.addEventListener('click', function () { hideTip(); location.hash = 'ev/' + g.getAttribute('data-v'); });
  });
}

function drawTopBar(el) {
  var rows = Object.keys(byG).map(function (id) {
    var b = byG[id], c = { '明确': 0, '可推断': 0, '仅日期巧合': 0 };
    b.prac.forEach(function (p) { if (c[p.ev] != null) c[p.ev]++; });
    return { id: id, c: c, t: b.prac.length };
  }).filter(function (r) { return r.t > 0; }).sort(function (a, b) { return b.t - a.t; }).slice(0, 15);
  var W = Math.max(el.clientWidth - 32, 300), rowH = 24, lab = I.en() ? Math.min(190, W * 0.45) : 90, H = rows.length * rowH + 24;
  var max = rows[0].t, sx = function (n) { return n / max * (W - lab - 40); };
  var keys = ['明确', '可推断', '仅日期巧合'], fills = ['var(--ev1)', 'var(--ev2)', 'var(--ev3)'];
  var s = '<svg width="' + W + '" height="' + H + '" role="img" aria-label="' + L('实践记录最多的神明', 'Deities with the most practice records') + '">';
  rows.forEach(function (r, i) {
    var y = i * rowH + 4, x = lab;
    s += '<text x="' + (lab - 8) + '" y="' + (y + 14) + '" text-anchor="end" style="fill:var(--ink);font-size:' + (I.en() ? 12 : 13) + 'px">' + esc(NT(gName(r.id))) + '</text>';
    keys.forEach(function (k, j) {
      var w = sx(r.c[k]); if (!w) return;
      s += '<rect data-g="' + r.id + '" x="' + x + '" y="' + y + '" width="' + Math.max(w - 2, 1) + '" height="16" rx="3" style="fill:' + fills[j] + ';cursor:pointer"/>';
      x += w;
    });
    s += '<text x="' + (x + 4) + '" y="' + (y + 13) + '">' + r.t + '</text>';
  });
  s += '</svg>';
  el.innerHTML = s;
  el.querySelectorAll('rect').forEach(function (rc) {
    var r = rows.filter(function (q) { return q.id === rc.getAttribute('data-g'); })[0];
    rc.addEventListener('mousemove', function (e) {
      showTip(e, '<b>' + N(gName(r.id)) + '</b><br>' + C('明确') + ' ' + r.c['明确'] + ' · ' + C('可推断') + ' ' + r.c['可推断'] + ' · ' + C('仅日期巧合') + ' ' + r.c['仅日期巧合'] + '<br><span class="muted">' + L('点击看档案', 'Click for profile') + '</span>');
    });
    rc.addEventListener('mouseleave', hideTip);
    rc.addEventListener('click', function () { hideTip(); location.hash = 'g/' + r.id; });
  });
}

// ---------- 视图：版本对照矩阵 ----------
var M = { q: '', type: '', only: 'any', sort: 'prac' };
function viewMatrix() {
  var types = {}; D.deities.forEach(function (g) { types[g.type || '未分类'] = 1; });
  var h = L('<h1>版本对照</h1><p class="lede">每行一个神明（持斋研究数据库），每列一个斋历版本（版本对比工作簿，按年代）。格中是该神在该版本中的第一个日期（农历），×n 为条数，○ 为有条目但不是具体月日；灰底列是《玉匣記》系统以外的文本。右侧三列是叙事史料的条数（实践记录括号内为言及持斋的条数）。神明与斋历条目暂按名称对应，标「待核」者尚未核对。点一行看神明档案。</p>',
      '<h1>Editions compared</h1><p class="lede">Each row is a deity of the fasting database; each column an edition of the calendars (comparison workbook, in chronological order). A cell gives the deity’s first (lunar) date in that edition; ×n is the number of entries, ○ an entry without a specific month and day; shaded columns are texts outside the <i>Yuxiaji</i> line. The three right-hand columns count narrative sources (in brackets: practice records that mention fasting). Deities are provisionally matched to calendar entries by name; “to verify” marks matches not yet checked. Click a row for the deity’s profile.</p>') +
    '<div class="controls">' +
    '<input type="search" id="mq" placeholder="' + L('搜神名或异名', 'Search name or alias (Chinese or pinyin)') + '" value="' + esc(M.q) + '">' +
    '<select id="mt"><option value="">' + L('全部类型', 'All types') + '</option>' + Object.keys(types).map(function (t) { return '<option value="' + esc(t) + '"' + (M.type === t ? ' selected' : '') + '>' + esc(C(t)) + '</option>'; }).join('') + '</select>' +
    '<select id="mo">' +
    [['any', '全部神明', 'All deities'], ['prac', '有持斋实践记录', 'With fasting practice records'], ['gap', '有持斋实践、但道藏本《玉匣記》（1607）未收', 'Fasting practice, but absent from the Daozang Yuxiaji (1607)'], ['nocal', '有持斋实践、但所有斋历版本都未收（或尚未对应）', 'Fasting practice, but in no calendar edition (or not yet matched)'], ['onlycal', '只见于斋历、无任何叙事记录', 'Only in calendars, no narrative record']]
      .map(function (o) { return '<option value="' + o[0] + '"' + (M.only === o[0] ? ' selected' : '') + '>' + L(o[1], o[2]) + '</option>'; }).join('') +
    '</select><span class="muted small" id="mcount"></span></div>' +
    '<div class="scroll"><table class="edm" id="mtab"></table></div>';
  app.innerHTML = h;
  var fill = function () {
    var q = M.q.trim().toLowerCase();
    var rows = D.deities.filter(function (g) {
      var b = byG[g.id] || bucket(g.id), fp = fastPrac(b).length;
      if (q && (g.name + g.alias + ' ' + I.py(g.name)).toLowerCase().indexOf(q) < 0) return false;
      if (M.type && (g.type || '未分类') !== M.type) return false;
      if (M.only === 'prac' && !fp) return false;

      if (M.only === 'nocal' && !(fp && !b.nCal)) return false;
      if (M.only === 'onlycal' && !(b.nCal && !b.prac.length && !b.sb.length && !b.fs.length)) return false;
      return true;
    });
    var key = function (g) {
      var b = byG[g.id];
      if (M.sort === 'name') return g.id;

      if (M.sort === 'sb') return -b.sb.length;
      if (M.sort === 'fs') return -b.fs.length;
      return -((b.ed[+M.sort.slice(1)] || []).length);
    };

      '<th class="sortable num" data-s="prac">' + L('实践', 'Practice') + '</th><th class="sortable num" data-s="sb">' + L('申报', '<i>Shenbao</i>') + '</th><th class="sortable num" data-s="fs">' + L('风俗志', 'Customs') + '</th></tr></thead>';
    var body = rows.map(function (g) {
      var b = byG[g.id], fp = fastPrac(b).length;
      return '<tr class="row" data-g="' + g.id + '"><td class="edn"><b>' + N(g.name) + '</b>' + pendTag(b) + (fp && !b.ed[V0] ? '<br><span class="flag">' + L('道藏本未收', 'not in Daozang ed.') + '</span>' : '') + '</td><td class="small muted">' + esc(C(g.type)) + '</td>' +
        EVS.map(function (v) { return edCell(v, b.ed[v.i]); }).join('') +
        '<td class="num">' + (b.prac.length ? b.prac.length + ' <span class="muted">(' + fp + ')</span>' : '<span class="cell-empty">0</span>') + '</td>' +
        '<td class="num">' + (b.sb.length || '<span class="cell-empty">0</span>') + '</td>' +
        '<td class="num">' + (b.fs.length || '<span class="cell-empty">0</span>') + '</td></tr>';
    }).join('');
    document.getElementById('mtab').innerHTML = head + '<tbody>' + body + '</tbody>';
    document.querySelectorAll('#mtab th.sortable').forEach(function (th) { th.onclick = function (e) { e.preventDefault(); M.sort = th.getAttribute('data-s'); fill(); }; });
  };
  fill();
  document.getElementById('mq').oninput = function (e) { M.q = e.target.value; fill(); };
  document.getElementById('mt').onchange = function (e) { M.type = e.target.value; fill(); };
  document.getElementById('mo').onchange = function (e) { M.only = e.target.value; fill(); };
  document.getElementById('mtab').onclick = function (e) { if (e.target.closest('thead')) return; var tr = e.target.closest('tr.row'); if (tr) location.hash = 'g/' + tr.getAttribute('data-g'); };

// ---------- 视图：斋期日历 ----------
var CAL = { weak: false, vs: null };
function calDefault() {
  // 默认四个：道藏本 1607、1684、1891、《同善錄》正心致福齋期
  var pick = [function (v) { return +v.no === 1; }, function (v) { return v.year === 1684; }, function (v) { return v.year === 1891; }, function (v) { return /正心致福/.test(v.sheet); }];
  var out = [];
  pick.forEach(function (f) { var v = EVS.filter(f)[0]; if (v && out.indexOf(v.i) < 0) out.push(v.i); });
  EVS.forEach(function (v) { if (out.length < 4 && out.indexOf(v.i) < 0) out.push(v.i); });
  return out;
}
function viewCalendar() {
  if (!CAL.vs) CAL.vs = calDefault();
  var lanes = CAL.vs.map(function (vi, j) { return { v: ED.versions[vi], cls: 'v-L' + j }; });
  lanes.push({ p: 1 });
  var h = L('<h1>斋期日历</h1><p class="lede">按月排列所选斋历版本的神诞与斋日，最右一列是实践记录中的日期。把鼠标移到一个神名上，所有版本里同一个神都会高亮。神名后的绿点表示有实践记录对上这一条（黄点：存在偏差），鼠标移上去可看是哪几条。点击进入神明档案或诸本对照。</p>',
      '<h1>Fasting calendar</h1><p class="lede">Deity birthdays and fast days in the chosen editions, arranged by lunar month; the right-hand column gives dates from practice records. Hover over a deity and the same deity lights up in every column. A green dot after a name means a practice record has been matched to that entry (yellow: with deviation); hover to see which. Click to open the deity’s profile or its collation.</p>') +
    '<p class="small muted" style="margin:0 0 6px">' + L('选择要对照的版本（最多 4 个）：', 'Choose editions to compare (up to 4):') + '</p><div class="vpick">' + EVS.map(function (v) {
      var on = CAL.vs.indexOf(v.i) >= 0;
      return '<button type="button" data-v="' + v.i + '" aria-pressed="' + on + '"' + (!on && CAL.vs.length >= 4 ? ' disabled' : '') + '>' + edWhen(v) + ' ' + N(v.short) + '</button>';
    }).join('') + '</div>' +
    '<div class="controls"><label><input type="checkbox" id="weak"' + (CAL.weak ? ' checked' : '') + '> ' + L('实践记录也显示「仅日期巧合」（未言斋）的条目（虚线）', 'Also show practice records that only coincide with the date (no fasting mentioned; dotted)') + '</label></div>' +
    '<div class="legend">' + lanes.filter(function (l) { return l.v; }).map(function (l) { return '<span>' + vSw(l.cls) + edWhen(l.v) + ' ' + N(l.v.short) + '</span>'; }).join('') + '<span><span class="sw" style="background:var(--ink-2)"></span>' + L('实践记录', 'Practice records') + '</span></div>' +
    '<div class="scroll"><div class="cal" style="--lanes:' + lanes.length + '">' +
    '<div class="hd">' + L('月', 'Month') + '</div>' + lanes.map(function (l) {
      return '<div class="hd">' + (l.v ? vSw(l.cls) + '<a href="#ev/' + l.v.i + '">' + N(l.v.short) + '</a> <span class="muted small">' + edWhen(l.v) + '</span>' : L('实践记录 <span class="muted small">叙事史料</span>', 'Practice records <span class="muted small">narrative sources</span>')) + '</div>';
    }).join('');
  var chip = function (e, cls) {
    var k = eKey(e), nm = e.k ? N(e.k) : N(e.l || e.t || '—'), ps = PBYE[e.id] || [];

    return '<span class="chip ' + cls + lk + '"' + (k ? ' data-g="' + esc(k) + '"' : '') + ' data-t="' + esc(e.id + ' ' + (e.mo || '') + (e.dy || '') + '｜' + (e.t || e.g || '') + (e.q ? '｜' + e.q : '') + pt) + '">' + (e.d ? '<span class="dd">' + e.d + '</span>' : '') + nm + '</span>';
  };
  var cell = function (mn, l) {

      D.practice.filter(function (p) { return p.mn === mn && p.g && (CAL.weak || p.ev !== NOFAST); }).forEach(function (p) {
        if (!agg[p.g]) { agg[p.g] = []; ord.push(p.g); }
        agg[p.g].push(p);
      });
      return ord.map(function (g) {

        return '<span class="chip p' + (weak ? ' weak' : '') + '" data-g="' + g + '" data-t="' + esc(t) + '">' + N(gName(g)) + (ps.length > 1 ? ' <span class="dd">×' + ps.length + '</span>' : '') + '</span>';
      }).join('');
    }
    return ED.entries.filter(function (e) { return e.v === l.v.i && e.m === mn; }).map(function (e) { return chip(e, l.cls); }).join('');
  };

    if (l.p) { var n = D.practice.filter(function (p) { return !p.mn && p.g && (CAL.weak || p.ev !== NOFAST); }).length; return '<div class="small muted">' + L(n + ' 条无法按月归入', n + ' records cannot be assigned to a month') + '</div>'; }
    return '<div>' + ED.entries.filter(function (e) { return e.v === l.v.i && !e.m; }).map(function (e) { return chip(e, l.cls); }).join('') + '</div>';
  }).join('');
  h += '</div></div>';
  app.innerHTML = h;
  document.getElementById('weak').onchange = function (e) { CAL.weak = e.target.checked; viewCalendar(); };
  app.querySelectorAll('.vpick button').forEach(function (b) {
    b.onclick = function () {
      var vi = +b.getAttribute('data-v'), k = CAL.vs.indexOf(vi);
      if (k >= 0) { if (CAL.vs.length > 1) CAL.vs.splice(k, 1); } else if (CAL.vs.length < 4) CAL.vs.push(vi);
      CAL.vs.sort(function (a, c) { return EVS.indexOf(ED.versions[a]) - EVS.indexOf(ED.versions[c]); });
      viewCalendar();
    };
  });
  var grid = app.querySelector('.cal');
  grid.addEventListener('mouseover', function (e) {
    var c = e.target.closest('.chip'); if (!c) return;
    var g = c.getAttribute('data-g');
    if (g) grid.querySelectorAll('.chip[data-g="' + g.replace(/"/g, '\\"') + '"]').forEach(function (x) { x.classList.add('hl'); });
  });
  grid.addEventListener('mousemove', function (e) { var c = e.target.closest('.chip'); if (c) showTip(e, esc(c.getAttribute('data-t')).replace(/\n/g, '<br>')); else hideTip(); });
  grid.addEventListener('mouseout', function (e) {
    var c = e.target.closest('.chip'); if (!c) return;
    grid.querySelectorAll('.chip.hl').forEach(function (x) { x.classList.remove('hl'); }); hideTip();
  });
  grid.addEventListener('click', function (e) { var c = e.target.closest('.chip'); if (c && c.getAttribute('data-g')) { hideTip(); location.hash = keyHref(c.getAttribute('data-g')).slice(1); } });
}

// ---------- 视图：实践与斋历 ----------
var FIT = { q: '', rel: '', open: {} };

      '<h1>Practice × calendar</h1><p class="lede">Where practice records (narrative sources) line up with calendar entries (normative texts), grouped by deity: one row per deity, giving how many practice records match, their date range, and which calendar day they match; click a row to see the records one by one. Practice without a deity (matched through the name of the fast, e.g. Zhongyuan) is grouped by the entry it matches. Each practice record is matched to one entry: when the same entry appears in several editions, the edition closest in date to the practice is used (on a tie, the <i>Yuxiaji</i> line is preferred); see “all editions” for the rest. “With deviation” means practice and prescription correspond but differ in date, length of fast, or name of deity or fast; notes left blank will be filled in later. All matches checked by the researcher (28 Oct 2026).</p>') +

    tile(nDev, L('存在偏差', 'With deviation'), L('对得上，但有出入', 'corresponding, but differing')) +
    tile(nNo, L('不对应', 'No match'), L('斋历未载的实践（研究者判定）', 'practice absent from the calendars (researcher’s judgement)')) + '</div>' +
    '<div class="controls"><input type="search" id="fq" placeholder="' + L('搜索神名、斋名、文献、地点、记录ID', 'Search deity, fast, source, place, record ID') + '" value="' + esc(FIT.q) + '">' +
    '<select id="frel"><option value="">' + L('全部', 'All') + '</option><option value="' + REL_FIT + '"' + (FIT.rel === REL_FIT ? ' selected' : '') + '>' + L('贴合', 'Fit') + '</option><option value="' + REL_DEV + '"' + (FIT.rel === REL_DEV ? ' selected' : '') + '>' + L('存在偏差', 'With deviation') + '</option></select>' +
    '<button type="button" id="fall">' + L('全部展开', 'Expand all') + '</button><button type="button" id="fnone">' + L('全部收起', 'Collapse all') + '</button>' +

  app.innerHTML = h;
  var detail = function (p) {

    return '<tr class="fitd"><td></td><td><b>' + esc(p.id) + '</b> ' + esc(p.year || '') + ' · ' + N(p.place) + ' ' + relTag(p) + '<div class="small">' + N(p.wt) + '｜' + (p.zhai ? N(p.zhai) : '—') + ' <span class="tag' + (p.ev === '明确' ? ' strong' : '') + '">' + esc(C(p.ev)) + '</span></div>' + (p.relNote ? '<div class="small muted">' + L('对应说明：', 'Note: ') + esc(p.relNote) + '</div>' : '') + '</td>' +
      '<td class="small">' + esc(DT(p.date) || '—') + '</td>' +
      '<td><a href="#ev/' + v.i + '">' + esc(e.id) + '</a> ' + edWhen(v) + ' ' + N(v.short) + '<div class="small">' + esc((e.mo || '') + (e.dy || '')) + '｜' + esc(e.t || e.g || '—') + (e.k ? ' <a class="muted" href="#ed/' + encodeURIComponent(e.k) + '">' + L('诸本', 'all editions') + '</a>' : '') + (p.g ? ' <a class="muted" href="#g/' + p.g + '/' + p.id + '">' + L('档案', 'profile') + '</a>' : '') + '</div></td></tr>';

    document.getElementById('fb').innerHTML = order.map(function (k) {

      dord.sort(function (a, b) { return days[b].n - days[a].n; });

      var name = k.indexOf('k:') === 0 ? '<a href="#ed/' + encodeURIComponent(k.slice(2)) + '">' + N(k.slice(2)) + '</a> <span class="muted small">' + L('（无神明，经斋名）', '(no deity; via fast name)') + '</span>' : godLink(k);
      return '<tr class="fitg' + (open ? ' open' : '') + '" data-k="' + esc(k) + '"><td><span class="tw">' + (open ? '▾' : '▸') + '</span> ' + name + '</td>' +
        '<td><b>' + rs.length + '</b> ' + L('条', '') + (nd ? ' <span class="small muted">' + L('（贴合 ' + nf + '，偏差 ' + nd + '）', '(fit ' + nf + ', dev. ' + nd + ')') + '</span>' : '') + '</td>' +
        '<td class="small" style="white-space:nowrap">' + yr + '</td>' +
        '<td class="small">' + dord.map(function (d) { return '<span class="fday">' + esc(d) + ' <span class="muted">×' + days[d].n + '</span></span>'; }).join('') + '</td></tr>' +
        (open ? rs.map(detail).join('') : '');
    }).join('');
  };
  fill();
  document.getElementById('fb').onclick = function (ev) {
    if (ev.target.closest('a')) return;
    var tr = ev.target.closest('tr.fitg'); if (!tr) return;
    var k = tr.getAttribute('data-k'); FIT.open[k] = !FIT.open[k]; fill();
  };
  document.getElementById('fall').onclick = function () { LINKED.forEach(function (p) { FIT.open[fitKey(p)] = true; }); fill(); };
  document.getElementById('fnone').onclick = function () { FIT.open = {}; fill(); };
  document.getElementById('fq').oninput = function (e) { FIT.q = e.target.value.trim(); fill(); };
  document.getElementById('frel').onchange = function (e) { FIT.rel = e.target.value; fill(); };

// ---------- 视图：流通地图（数据见 spread-data.js，资料源 tools/spread/spread_sources.json） ----------

  app.innerHTML = h;
  function curve(e, ins) {

    var k = (e.off ? -0.3 : 0.16) * Ln, mx = (a.x + b.x) / 2 - dy / Ln * k, my = (a.y + b.y) / 2 + dx / Ln * k;
    var sh = function (p, q, r) { var ux = q[0] - p[0], uy = q[1] - p[1], l = Math.sqrt(ux * ux + uy * uy); return [p[0] + ux / l * r, p[1] + uy / l * r]; };
    var s0 = sh([a.x, a.y], [mx, my], 8), t0 = sh([b.x, b.y], [mx, my], 9);

function drawStrip(el, b) {
  var W = Math.max(el.clientWidth - 32, 280), H = 96, x0 = 16, x1 = W - 16, lo = 1500, hi = 1950;
  var sx = function (y) { return x0 + (y - lo) / (hi - lo) * (x1 - x0); };
  var s = '<svg width="' + W + '" height="' + H + '" role="img" aria-label="' + L('年代分布', 'Distribution over time') + '">';
  for (var t = 1500; t <= 1950; t += 50) s += '<line class="gridl" x1="' + sx(t) + '" x2="' + sx(t) + '" y1="6" y2="72"/><text x="' + sx(t) + '" y="88" text-anchor="middle">' + t + '</text>';
  s += '<text x="' + x0 + '" y="22" style="font-size:10px">' + L('实践', 'Practice') + '</text><text x="' + x0 + '" y="56" style="font-size:10px">' + L('申报', 'Shenbao') + '</text>';
  var pts = [];
  b.prac.forEach(function (p) { var y = +p.year; if (y >= lo && y <= hi) pts.push({ x: sx(y), y: 30, weak: p.ev === NOFAST, t: p.id + ' ' + p.year + '｜' + NT(p.place) + '｜' + C(p.ev) + '｜' + NT(p.wt) }); });
  b.sb.forEach(function (r) { var y = +String(r.date).slice(0, 4); if (y) pts.push({ x: sx(y), y: 62, sb: 1, t: r.date + '｜' + NT(r.title) + '｜' + NT(r.place) }); });
  pts.forEach(function (p, i) {
    var jit = ((i * 37) % 9) - 4;
    s += '<circle data-i="' + i + '" cx="' + p.x + '" cy="' + (p.y + jit) + '" r="5" stroke-width="2" style="' +
      (p.sb ? 'fill:var(--v2);stroke:var(--surface)' : p.weak ? 'fill:var(--surface);stroke:var(--ev1)' : 'fill:var(--ev1);stroke:var(--surface)') + '"/>';
  });
  s += '</svg>';
  el.innerHTML = s;
  el.querySelectorAll('circle').forEach(function (c) {
    var p = pts[+c.getAttribute('data-i')];
    c.addEventListener('mousemove', function (e) { showTip(e, esc(p.t)); });
    c.addEventListener('mouseleave', hideTip);
  });
}

    return '<option value="' + esc(x.no) + '"' + (x === v ? ' selected' : '') + '>' + esc(x.when) + ' ' + esc(I.en() ? NT(x.short) : x.short) + L('（' + x.n + ' 条）', ' (' + x.n + ')') + '</option>';
  }).join('') + '</select></label>';
  app.innerHTML = '';
  ZhaiRing.mount(app, ringData(v), { headExtra: pick });
  pick.querySelector('select').onchange = function (e) { location.hash = 'ring/' + e.target.value; };
}

// ---------- 路由 ----------
function route() {
  hideTip();
  if (window.ZhaiRing) ZhaiRing.hideTip();
  var hsh = location.hash.replace(/^#/, '') || 'overview';
  var v = hsh.split('/')[0];
  var navV = v === 'g' ? 'gods' : (v === 'ed' || v === 'ev') ? 'editions' : v;
  document.querySelectorAll('#nav a').forEach(function (a) { a.classList.toggle('on', a.getAttribute('data-v') === navV); });
  if (v === 'g') viewGod(hsh.split('/')[1], hsh.split('/')[2]);
  else if (v === 'fit') viewFit();
  else if (v === 'matrix') viewMatrix();
  else if (v === 'editions') viewEditions();
  else if (v === 'ed') viewEdGod(decodeURIComponent(hsh.slice(3)));
  else if (v === 'ev') viewEdVersion(hsh.split('/')[1]);
  else if (v === 'calendar') viewCalendar();
  else if (v === 'gods') viewGods();
  else if (v === 'gaps') viewGaps();
  else if (v === 'context') viewContext();
  else if (v === 'ring') viewRing(hsh.split('/')[1]);
  else if (v === 'spread') viewSpread();
  else viewOverview();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
var rt; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(function () { var v = location.hash; if (!v || v === '#overview' || /^#g\/[^\/]+$/.test(v)) route(); }, 200); });
function footer() {
  document.getElementById('foot').innerHTML = L('数据来源：' + esc(D.source) + '。' + (D.noQuotes ? '公开版：实践记录、《申报》、风俗志及识典古籍所收斋期文本的原文摘录未收入，只列编号、摘要与编码。' : '') + '「已核对原书」目前全部为「否」：原文摘录多据电子文本或资料库全文，引用前请核原书。',
    'Data: ' + esc(D.source) + '. ' + (D.noQuotes ? 'Public version: quotations from practice records, the <i>Shenbao</i>, records of customs and calendar texts read in the Shidian guji 識典古籍 database are omitted; only IDs, summaries and codes are given. ' : '') +
    'No entry has yet been checked against the original book; quotations mostly follow electronic texts or database full text, so verify before citing. Proper names are given in pinyin with Chinese characters (pinyin generated automatically). Dates are lunar month/day. Research notes and summaries remain in Chinese.');
}
I.apply();
footer();
route();
})();
</script>
