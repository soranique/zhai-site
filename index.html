<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>神诞斋期版本对照</title>
<meta name="description" content="江南周期性神诞持斋研究：神明在各版本斋期表中的记载，与实践记录、《申报》、风俗志的对照。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ring.css?v=155a33f8">
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --surface-2: #f2f1ed;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --accent: #8a2b1a;
  --v1: #2a78d6; --v2: #eb6834; --v3: #1baf7a; --v4: #eda100;
  --ev1: #1c5cab; --ev2: #3987e5; --ev3: #86b6ef;
  --hl: #fff3c4;
  --yuan: #f6ebe7; --yuan-line: #dcbcb0;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #242422;
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --accent: #e0846f;
    --v1: #3987e5; --v2: #d95926; --v3: #199e70; --v4: #c98500;
    --ev1: #86b6ef; --ev2: #3987e5; --ev3: #184f95;
    --hl: #4a3f12;
    --yuan: #2c201c; --yuan-line: #5a3a30;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #242422;
  --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --accent: #e0846f;
  --v1: #3987e5; --v2: #d95926; --v3: #199e70; --v4: #c98500;
  --ev1: #86b6ef; --ev2: #3987e5; --ev3: #184f95;
  --hl: #4a3f12;
  --yuan: #2c201c; --yuan-line: #5a3a30;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font: 15px/1.7 "Noto Serif SC", "Songti SC", "SimSun", serif;
}
/* 英文界面：拉丁字母用 Noto Serif，汉字仍用 Noto Serif SC */
html[lang="en"] body { font-family: "Noto Serif", "Noto Serif SC", "Songti SC", "SimSun", serif; }
a { color: var(--accent); }
header.top {
  border-bottom: 1px solid var(--grid); background: var(--surface);
  position: sticky; top: 0; z-index: 10;
}
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px; }
.top .wrap { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding-top: 10px; padding-bottom: 10px; }
.brand { font-weight: 700; font-size: 17px; letter-spacing: .04em; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 8px; font-size: 13px; }
nav { display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto; }
nav a {
  text-decoration: none; color: var(--ink-2); padding: 4px 10px; border-radius: 6px; font-size: 14px;
}
nav a.on { background: var(--surface-2); color: var(--ink); font-weight: 600; }
#theme, #lang { background: none; border: 1px solid var(--grid); color: var(--ink-2); border-radius: 6px; padding: 3px 8px; cursor: pointer; font: inherit; font-size: 13px; }
main { padding: 24px 0 64px; }
h1 { font-size: 26px; margin: 0 0 6px; }
h2 { font-size: 19px; margin: 32px 0 10px; }
h3 { font-size: 16px; margin: 22px 0 8px; }
.lede { color: var(--ink-2); max-width: 760px; margin: 0 0 20px; }
.card { background: var(--surface); border: 1px solid var(--grid); border-radius: 10px; padding: 16px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.tile .n { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }
.tile .l { color: var(--ink-2); font-size: 13px; }
.tile .s { color: var(--muted); font-size: 12px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 0 0 12px; }
.controls input[type=search], .controls select {
  font: inherit; font-size: 14px; padding: 5px 9px; border: 1px solid var(--axis); border-radius: 6px;
  background: var(--surface); color: var(--ink); min-width: 0;
}
.controls label { font-size: 14px; color: var(--ink-2); display: inline-flex; gap: 5px; align-items: center; }
.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--grid); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
.scroll table { min-width: 760px; }
th, td { text-align: left; vertical-align: top; padding: 7px 10px; border-bottom: 1px solid var(--grid); }
th { font-weight: 600; color: var(--ink-2); background: var(--surface-2); position: sticky; top: 0; white-space: nowrap; }
th.sortable { cursor: pointer; }
th.sortable:hover { color: var(--ink); }
tr.row { cursor: pointer; }
tr.row:hover td { background: var(--surface-2); }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: 0; }
.v-W001 { --c: var(--v1); } .v-W014 { --c: var(--v2); } .v-W063 { --c: var(--v3); } .v-W085 { --c: var(--v4); }
.sw.v { background: var(--c); }
.cell-v { border-left: 3px solid var(--c); padding-left: 7px; }
.cell-empty { color: var(--axis); }
.tag { display: inline-block; font-size: 12px; padding: 0 6px; border-radius: 4px; border: 1px solid var(--axis); color: var(--ink-2); margin: 0 4px 2px 0; white-space: nowrap; }
.tag.strong { border-color: var(--ink-2); color: var(--ink); }
.flag { color: var(--accent); font-size: 12px; white-space: nowrap; }
/* calendar */
.cal { display: grid; grid-template-columns: 64px repeat(var(--lanes), minmax(150px, 1fr)); min-width: calc(64px + var(--lanes) * 150px); }
.cal > div { border-bottom: 1px solid var(--grid); border-right: 1px solid var(--grid); padding: 6px; }
.cal .hd { background: var(--surface-2); font-weight: 600; font-size: 13px; position: sticky; top: 0; }
.cal .mo { font-weight: 600; color: var(--ink-2); font-size: 14px; }
.chip {
  display: inline-block; font-size: 12px; line-height: 1.5; padding: 1px 6px; margin: 2px 3px 2px 0;
  border-radius: 4px; background: var(--surface-2); border-left: 3px solid var(--c, var(--axis)); cursor: pointer;
  color: var(--ink);
}
.chip.p { border-left: 3px solid var(--ink-2); }
.chip.p.weak { border-left-style: dotted; color: var(--ink-2); }
.chip.hl { background: var(--hl); outline: 1px solid var(--ink-2); }
.chip .dd { color: var(--muted); margin-right: 3px; }
/* profile */
.prof-head { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; }
.prof-head h1 { margin: 0; }
.kv { display: grid; grid-template-columns: 90px 1fr; gap: 4px 12px; font-size: 14px; margin-top: 10px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.rec { border-top: 1px solid var(--grid); padding: 10px 0; }
.rec:first-child { border-top: 0; }
.rec .meta { font-size: 13px; color: var(--ink-2); }
.rec .q { margin: 6px 0 2px; padding-left: 10px; border-left: 2px solid var(--axis); color: var(--ink); font-size: 14px; }
.rec .nt { font-size: 13px; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
.godlist { columns: 4 160px; font-size: 14px; }
.godlist a { display: block; text-decoration: none; color: var(--ink); padding: 1px 0; }
.godlist a span { color: var(--muted); font-size: 12px; }
svg text { fill: var(--ink-2); font-size: 11px; font-family: inherit; }
svg .axis { stroke: var(--axis); }
svg .gridl { stroke: var(--grid); }
.tip {
  position: fixed; pointer-events: none; z-index: 50; background: var(--surface); color: var(--ink);
  border: 1px solid var(--axis); border-radius: 8px; padding: 8px 10px; font-size: 13px; max-width: 300px;
  box-shadow: 0 4px 16px rgba(0,0,0,.12); display: none;
}
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink-2); margin: 6px 0 10px; }
.legend .sw.e1 { background: var(--ev1); } .legend .sw.e2 { background: var(--ev2); } .legend .sw.e3 { background: var(--ev3); }
.gap li { margin-bottom: 6px; }
.gap .cnt { font-weight: 700; font-variant-numeric: tabular-nums; }
/* 源流与框架 */
.flow { display: grid; grid-template-columns: 150px repeat(5, minmax(120px, 1fr)) 26px 190px; min-width: 1000px; padding: 16px; row-gap: 14px; }
.flow .ph { font-weight: 700; text-align: center; font-size: 15px; padding-bottom: 2px; }
.flow .ph.y { color: var(--accent); }
.flow .lane { font-size: 12px; line-height: 1.5; color: var(--muted); display: flex; flex-direction: column; justify-content: center; padding-right: 10px; }
.flow .lane b { color: var(--ink); font-size: 14px; }
.flow .cell { display: flex; align-items: stretch; min-height: 76px; position: relative; }
.flow .bx { flex: 1; display: flex; flex-direction: column; justify-content: center; text-align: center; font-size: 12.5px; line-height: 1.55; color: var(--ink-2); background: var(--surface); border: 1px solid var(--axis); border-radius: 8px; padding: 8px 8px; }
.flow .bx b { color: var(--ink); font-size: 13.5px; }
.flow .bx.y { background: var(--yuan); border-color: var(--yuan-line); }
.flow .bx.q { background: transparent; border-style: dashed; }
.flow .ln, .flow .st { flex: 1; position: relative; min-width: 0; }
.flow .st { flex: 0 0 22px; }
.flow .ln::before, .flow .st::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 2px solid var(--accent); }
.flow .st::before { right: 7px; }
.flow .st::after { content: ""; position: absolute; right: 0; top: calc(50% - 5px); border-left: 8px solid var(--accent); border-top: 6px solid transparent; border-bottom: 6px solid transparent; transform: translateY(1px); }
.flow .d::before { border-top-style: dashed; border-top-color: var(--muted); }
.flow .st.d::after { border-left-color: var(--muted); }
.flow .note { position: absolute; left: 0; right: 0; bottom: -2px; text-align: center; font-size: 11.5px; line-height: 1.3; color: var(--accent); background: transparent; }
.flow .note.m { color: var(--muted); }
.flow .qing { grid-column: 8; display: flex; flex-direction: column; justify-content: center; text-align: center; background: var(--ink); color: var(--page); border-radius: 10px; padding: 18px 12px; font-size: 13.5px; line-height: 1.9; }
.flow .qing b { font-size: 17px; line-height: 1.6; }
.flow .qing .s { opacity: .75; font-size: 12.5px; }
.lg { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 13px; color: var(--ink-2); margin: 8px 0 0; align-items: center; }
.lg i { display: inline-block; width: 30px; vertical-align: middle; margin-right: 6px; border-top: 2px solid var(--accent); }
.lg i.d { border-top: 2px dashed var(--muted); }
.lg i.bxq { width: 24px; height: 14px; border: 1px dashed var(--muted); border-radius: 3px; }
.lg i.bxy { width: 24px; height: 14px; border: 1px solid var(--yuan-line); background: var(--yuan); border-radius: 3px; }
.fw { display: grid; grid-template-columns: 170px 1fr 1fr 250px; gap: 12px; }
.fw .layer { border-radius: 10px; padding: 14px; display: contents; }
.fw .lab { display: flex; flex-direction: column; justify-content: center; font-size: 13px; color: var(--muted); line-height: 1.6; padding: 10px 0 10px 12px; border-left: 4px solid var(--c); }
.fw .lab b { color: var(--ink); font-size: 17px; }
.fw .dim { background: var(--surface); border: 1px solid var(--grid); border-top: 3px solid var(--c); border-radius: 8px; padding: 12px 16px; font-size: 14px; color: var(--ink-2); }
.fw .dim b { display: block; color: var(--ink); font-size: 15.5px; margin-bottom: 2px; }
.fw .dim .s { font-size: 12.5px; color: var(--muted); }
.fw .ax { grid-column: 4; grid-row: 1 / span 3; background: var(--ink); color: var(--page); border-radius: 10px; padding: 20px 18px; font-size: 14px; line-height: 1.8; display: flex; flex-direction: column; justify-content: center; }
.fw .ax b.t { font-size: 18px; }
.fw .ax .s { opacity: .75; font-size: 13px; }
.units { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 18px; }
.units .lab0 { font-weight: 700; font-size: 16px; min-width: 170px; }
.units .u { background: var(--surface); border: 1px solid var(--grid); border-radius: 8px; padding: 10px 16px; text-align: center; font-size: 13px; color: var(--ink-2); flex: 1 1 180px; }
.units .u b { display: block; color: var(--ink); font-size: 15px; }
.units .arr { color: var(--muted); font-size: 13px; white-space: nowrap; }
.swipe { display: none; }
@media (max-width: 1040px) { .swipe { display: block; } }
@media (max-width: 760px) {
  .fw { grid-template-columns: 1fr; }
  .fw .ax { grid-column: auto; grid-row: auto; }
  .units .arr { display: none; }
}
footer { color: var(--muted); font-size: 12px; border-top: 1px solid var(--grid); padding: 16px 0 32px; }
@media (max-width: 640px) {
  h1 { font-size: 22px; }
  .tile .n { font-size: 24px; }
  nav { margin-left: 0; }
  .kv { grid-template-columns: 70px 1fr; }
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand" data-en="Deity-Day Fasting Calendars<small>Periodic fasting in Jiangnan 江南</small>">神诞斋期版本对照<small>江南周期性持斋研究</small></div>
    <nav id="nav">
      <a href="#overview" data-v="overview" data-en="Overview">概览</a>
      <a href="#matrix" data-v="matrix" data-en="Editions">版本对照</a>
      <a href="#calendar" data-v="calendar" data-en="Calendar">斋期日历</a>
      <a href="#ring" data-v="ring" data-en="Ring calendar">环形历</a>
      <a href="#gods" data-v="gods" data-en="Deities">神明档案</a>

</header>

<script>
(function () {
'use strict';
var D = window.ZHAI;
var app = document.getElementById('app');
var tip = document.getElementById('tip');

// ---------- 语言 ----------
var I = window.ZhaiI18n, L = I.L, N = I.N, NT = I.NT, C = I.C, DT = I.D;
I.addPinyin(D.py, D.pyTitle);
if (window.ZHAI_RING) I.addPinyin(window.ZHAI_RING.py, window.ZHAI_RING.pyTitle);
document.getElementById('lang').onclick = function () { I.set(I.en() ? 'zh' : 'en'); footer(); route(); };

// ---------- 主题 ----------
var themeBtn = document.getElementById('theme');
try { var saved = localStorage.getItem('zhai-theme'); if (saved) document.documentElement.setAttribute('data-theme', saved); } catch (e) {}
themeBtn.onclick = function () {
  var cur = document.documentElement.getAttribute('data-theme');
  var dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  var next = dark ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('zhai-theme', next); } catch (e) {}
};

// ---------- 数据索引 ----------
var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
var G = {}; D.deities.forEach(function (g) { G[g.id] = g; });
var V = {}; D.versions.forEach(function (v) { V[v.id] = v; });
var HAVE = D.versions.filter(function (v) { return v.n > 0; })
  .sort(function (a, b) { return order(a) - order(b); });
function order(v) { return { W001: 1, W014: 2, W085: 3, W063: 4 }[v.id] || 9; }
function vYear(v) { return v.year ? String(v.year) : (v.date ? C(v.date) : L('年代未定', 'undated')); }
var MN = ['', '正月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '十一月', '十二月'];
function monthName(m) { return I.en() ? I.ord(m) + ' month' : MN[m]; }
function gName(id) { return G[id] ? G[id].name : id; }

var byG = {};
function bucket(id) { return byG[id] || (byG[id] = { cal: {}, nCal: 0, prac: [], sb: [], fs: [], cl: [] }); }
D.calendar.forEach(function (c) { if (!c.g) return; var b = bucket(c.g); (b.cal[c.w] = b.cal[c.w] || []).push(c); b.nCal++; });
D.practice.forEach(function (p) { if (p.g) bucket(p.g).prac.push(p); });
D.shenbao.forEach(function (s) { s.gs.forEach(function (g) { bucket(g).sb.push(s); }); });
D.fengsu.forEach(function (s) { s.gs.forEach(function (g) { bucket(g).fs.push(s); }); });
D.classics.forEach(function (s) { s.gs.forEach(function (g) { bucket(g).cl.push(s); }); });
var NOFAST = '仅日期巧合';
function fastPrac(b) { return b.prac.filter(function (p) { return p.ev !== NOFAST; }); }
function dateOf(c) { return DT([c.m, c.d].filter(Boolean).join('')) || L('（无日期）', '(no date)'); }
function dayOnly(d) { return I.en() ? DT(d).replace(/day /g, '') : d; }
function godLink(id, txt) { return '<a href="#g/' + id + '">' + (txt ? esc(txt) : N(gName(id))) + '</a>'; }
function vSw(id) { return '<span class="sw v v-' + id + '"></span>'; }
function vName(v) { return N(v.title) + (v.ed ? '<span class="muted small">（' + esc(v.ed) + '）</span>' : ''); }
function aliases(s) { return I.en() ? s.split(/[、，,；;]/).map(function (a) { return N(a.trim()); }).join(', ') : esc(s); }
function zhNote() { return I.en() ? ' <span class="muted small">[Chinese]</span>' : ''; }

// ---------- 提示框 ----------
function showTip(e, html) {
  tip.innerHTML = html; tip.style.display = 'block';
  var x = e.clientX + 14, y = e.clientY + 14, w = tip.offsetWidth, h = tip.offsetHeight;
  if (x + w > innerWidth - 8) x = e.clientX - w - 14;
  if (y + h > innerHeight - 8) y = e.clientY - h - 14;
  tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px';
}
function hideTip() { tip.style.display = 'none'; }

// ---------- 视图：概览 ----------
function viewOverview() {
  var have = HAVE.length, all = D.versions.length;
  var strong = D.practice.filter(function (p) { return p.ev !== NOFAST; }).length;
  var extra = D.deities.filter(function (g) { return /^X/.test(g.id); }).length;
  var h = L('<h1>神明在斋期表各版本中的记载</h1>', '<h1>How deities appear across editions of fasting calendars</h1>') +
    L('<p class="lede">以神明为单位，对照：①规范性文本（斋期表、善书斋名清单）各版本记了哪些神、哪天、要不要斋；②实践记录、《申报》、风俗志中这些神的斋是否真的有人守。数据来自「' + esc(D.source) + '」。</p>',
      '<p class="lede">Organized by deity, the site compares (1) which gods, which days, and whether fasting is required in each edition of the prescriptive texts (fasting calendars and lists of named fasts in morality books), and (2) whether people actually kept these gods’ fasts, according to practice records, the <i>Shenbao</i> 申報 and records of local customs. Data: “' + esc(D.source) + '”.</p>') +
    '<div class="tiles">' +
    tile(D.deities.length - extra, L('神明（神明表）', 'Deities (register)'), L('另有 ' + extra + ' 个只见于斋期表的神名', extra + ' more names appear only in calendars')) +
    tile(have + ' / ' + all, L('已取得的斋期文本', 'Calendar texts obtained'), L('其余 ' + (all - have) + ' 种待取得', (all - have) + ' still to be obtained')) +
    tile(D.calendar.length, L('斋期表条目', 'Calendar entries'), L('「与前一版本相比」全部为「未比较」', 'None yet compared with an earlier edition')) +
    tile(D.practice.length, L('实践记录', 'Practice records'), L('其中言及持斋 ' + strong + ' 条', strong + ' mention fasting')) +

function tile(n, l, s) { return '<div class="card tile"><div class="n">' + n + '</div><div class="l">' + l + '</div>' + (s ? '<div class="s">' + s + '</div>' : '') + '</div>'; }
function vInfo(v) {

function drawTimeline(el) {
  var vs = D.versions.slice().sort(function (a, b) { return (a.year || 9999) - (b.year || 9999); });
  var W = Math.max(el.clientWidth - 32, 300), rowH = 24, wide = I.en() && W >= 700;
  var lab = I.en() ? (wide ? Math.min(330, W * 0.42) : Math.min(120, W * 0.32)) : Math.min(170, W * 0.38), H = vs.length * rowH + 30;
  var x0 = lab + 10, x1 = W - 70, lo = 1600, hi = 1940, xu = W - 30;
  var sx = function (yr) { return x0 + (yr - lo) / (hi - lo) * (x1 - x0); };
  var s = '<svg width="' + W + '" height="' + H + '" role="img" aria-label="' + L('斋期文本版本时间线', 'Timeline of calendar editions') + '">';
  for (var t = 1600; t <= 1940; t += (W < 500 ? 100 : 50)) s += '<line class="gridl" x1="' + sx(t) + '" x2="' + sx(t) + '" y1="0" y2="' + (H - 22) + '"/><text x="' + sx(t) + '" y="' + (H - 6) + '" text-anchor="middle">' + t + '</text>';
  s += '<text x="' + xu + '" y="' + (H - 6) + '" text-anchor="middle">' + L('未定', 'n.d.') + '</text>';
  vs.forEach(function (v, i) {
    var y = i * rowH + 14, cx = v.year ? sx(v.year) : xu, got = v.n > 0;
    var name = wide ? NT(v.title) : v.title;
    s += '<g class="v-' + v.id + '" data-v="' + v.id + '" style="cursor:pointer">' +
      '<rect x="0" y="' + (y - 11) + '" width="' + W + '" height="' + rowH + '" fill="transparent"/>' +
      '<text x="' + lab + '" y="' + (y + 4) + '" text-anchor="end" style="font-size:' + (wide ? 11.5 : 12) + 'px;' + (got ? 'fill:var(--ink);font-weight:600' : '') + '">' + esc(name) + (got ? L('（' + v.n + '条）', ' (' + v.n + ')') : '') + '</text>' +
      '<line class="gridl" x1="' + x0 + '" x2="' + cx + '" y1="' + y + '" y2="' + y + '" stroke-dasharray="2 3"/>' +
      '<circle cx="' + cx + '" cy="' + y + '" r="6" stroke-width="2" style="fill:' + (got ? 'var(--c,var(--ink-2))' : 'var(--surface)') + ';stroke:' + (got ? 'var(--surface)' : 'var(--muted)') + '"/></g>';
  });
  s += '</svg>';
  el.innerHTML = s + '<div id="vinfo" class="small" style="margin-top:6px;min-height:3em"></div>';
  el.querySelectorAll('g[data-v]').forEach(function (g) {
    var html = vInfo(V[g.getAttribute('data-v')]);
    g.addEventListener('mousemove', function (e) { showTip(e, html); });
    g.addEventListener('mouseleave', hideTip);
    g.addEventListener('click', function () { document.getElementById('vinfo').innerHTML = html; });
  });
}

function drawTopBar(el) {
  var rows = Object.keys(byG).map(function (id) {
    var b = byG[id], c = { '明确': 0, '可推断': 0, '仅日期巧合': 0 };
    b.prac.forEach(function (p) { if (c[p.ev] != null) c[p.ev]++; });
    return { id: id, c: c, t: b.prac.length };
  }).filter(function (r) { return r.t > 0; }).sort(function (a, b) { return b.t - a.t; }).slice(0, 15);
  var W = Math.max(el.clientWidth - 32, 300), rowH = 24, lab = I.en() ? Math.min(190, W * 0.45) : 90, H = rows.length * rowH + 24;
  var max = rows[0].t, sx = function (n) { return n / max * (W - lab - 40); };
  var keys = ['明确', '可推断', '仅日期巧合'], fills = ['var(--ev1)', 'var(--ev2)', 'var(--ev3)'];
  var s = '<svg width="' + W + '" height="' + H + '" role="img" aria-label="' + L('实践记录最多的神明', 'Deities with the most practice records') + '">';
  rows.forEach(function (r, i) {
    var y = i * rowH + 4, x = lab;
    s += '<text x="' + (lab - 8) + '" y="' + (y + 14) + '" text-anchor="end" style="fill:var(--ink);font-size:' + (I.en() ? 12 : 13) + 'px">' + esc(NT(gName(r.id))) + '</text>';
    keys.forEach(function (k, j) {
      var w = sx(r.c[k]); if (!w) return;
      s += '<rect data-g="' + r.id + '" x="' + x + '" y="' + y + '" width="' + Math.max(w - 2, 1) + '" height="16" rx="3" style="fill:' + fills[j] + ';cursor:pointer"/>';
      x += w;
    });
    s += '<text x="' + (x + 4) + '" y="' + (y + 13) + '">' + r.t + '</text>';
  });
  s += '</svg>';
  el.innerHTML = s;
  el.querySelectorAll('rect').forEach(function (rc) {
    var r = rows.filter(function (q) { return q.id === rc.getAttribute('data-g'); })[0];
    rc.addEventListener('mousemove', function (e) {
      showTip(e, '<b>' + N(gName(r.id)) + '</b><br>' + C('明确') + ' ' + r.c['明确'] + ' · ' + C('可推断') + ' ' + r.c['可推断'] + ' · ' + C('仅日期巧合') + ' ' + r.c['仅日期巧合'] + '<br><span class="muted">' + L('点击看档案', 'Click for profile') + '</span>');
    });
    rc.addEventListener('mouseleave', hideTip);
    rc.addEventListener('click', function () { hideTip(); location.hash = 'g/' + r.id; });
  });
}

  app.innerHTML = h;
  var fill = function () {

var CAL = { weak: false };
function viewCalendar() {
  var lanes = HAVE.map(function (v) { return { id: v.id, name: v.title, sub: vYear(v) }; });
  lanes.push({ id: 'P', name: '', sub: '' });
  var h = L('<h1>斋期日历</h1><p class="lede">按月排列各版本所记的神诞与斋日，最右一列是实践记录中的日期。把鼠标移到一个神名上，所有版本里同一个神都会高亮，可以看出同一神在不同版本中的日期是否一致、哪个版本有而哪个版本无。点击进入神明档案。</p>',
      '<h1>Fasting calendar</h1><p class="lede">Deity birthdays and fast days in each edition, arranged by lunar month; the right-hand column gives dates from practice records. Hover over a deity and the same deity lights up in every edition, showing whether its dates agree and which editions include or omit it. Click to open the deity’s profile.</p>') +
    '<div class="controls"><label><input type="checkbox" id="weak"' + (CAL.weak ? ' checked' : '') + '> ' + L('实践记录也显示「仅日期巧合」（未言斋）的条目（虚线）', 'Also show practice records that only coincide with the date (no fasting mentioned; dotted)') + '</label></div>' +
    '<div class="legend">' + HAVE.map(function (v) { return '<span>' + vSw(v.id) + N(v.title) + '</span>'; }).join('') + '<span><span class="sw" style="background:var(--ink-2)"></span>' + L('实践记录', 'Practice records') + '</span></div>' +
    '<div class="scroll"><div class="cal" style="--lanes:' + lanes.length + '">' +
    '<div class="hd">' + L('月', 'Month') + '</div>' + lanes.map(function (l) {
      return '<div class="hd">' + (l.id !== 'P' ? vSw(l.id) + N(l.name) + ' <span class="muted small">' + esc(l.sub) + '</span>' : L('实践记录 <span class="muted small">叙事史料</span>', 'Practice records <span class="muted small">narrative sources</span>')) + '</div>';
    }).join('');
  var cell = function (mn, l) {
    if (l.id === 'P') {
      var agg = {}, ord = [];
      D.practice.filter(function (p) { return p.mn === mn && p.g && (CAL.weak || p.ev !== NOFAST); }).forEach(function (p) {
        if (!agg[p.g]) { agg[p.g] = []; ord.push(p.g); }
        agg[p.g].push(p);
      });
      return ord.map(function (g) {
        var ps = agg[g], weak = ps.every(function (p) { return p.ev === NOFAST; });
        var t = ps.map(function (p) { return p.id + ' ' + DT(p.date) + '｜' + C(p.period) + '｜' + NT(p.place) + '｜' + C(p.ev); }).join('\n');
        return '<span class="chip p' + (weak ? ' weak' : '') + '" data-g="' + g + '" data-t="' + esc(t) + '">' + N(gName(g)) + (ps.length > 1 ? ' <span class="dd">×' + ps.length + '</span>' : '') + '</span>';
      }).join('');
    }
    return D.calendar.filter(function (c) { return c.w === l.id && c.mn === mn; }).map(function (c) {
      var nm = c.g ? N(gName(c.g)) : N(c.label || c.zhai || '节令');
      return '<span class="chip v-' + c.w + '"' + (c.g ? ' data-g="' + c.g + '"' : '') + ' data-t="' + esc(c.id + ' ' + dateOf(c) + '｜' + NT(c.label || '') + (c.req ? '｜' + NT(c.req) : '')) + '"><span class="dd">' + esc(dayOnly(c.d || '')) + '</span>' + nm + '</span>';
    }).join('');
  };
  for (var mn = 1; mn <= 12; mn++) {
    h += '<div class="mo">' + monthName(mn) + '</div>' + lanes.map(function (l) { return '<div>' + cell(mn, l) + '</div>'; }).join('');
  }
  h += '<div class="mo small">' + L('每月／不定', 'Monthly / unfixed') + '</div>' + lanes.map(function (l) {
    if (l.id === 'P') { var n = D.practice.filter(function (p) { return !p.mn && p.g && (CAL.weak || p.ev !== NOFAST); }).length; return '<div class="small muted">' + L(n + ' 条无法按月归入', n + ' records cannot be assigned to a month') + '</div>'; }
    return '<div>' + D.calendar.filter(function (c) { return c.w === l.id && !c.mn; }).map(function (c) {
      var nm = c.g ? N(gName(c.g)) : N(c.zhai || c.label);
      return '<span class="chip v-' + c.w + '"' + (c.g ? ' data-g="' + c.g + '"' : '') + ' data-t="' + esc(c.id + ' ' + DT((c.m || '') + (c.d || '')) + '｜' + NT(c.zhai || '') + '｜' + (c.label || '')) + '">' + nm + '</span>';
    }).join('') + '</div>';
  }).join('');
  h += '</div></div>';
  app.innerHTML = h;
  document.getElementById('weak').onchange = function (e) { CAL.weak = e.target.checked; viewCalendar(); };
  var grid = app.querySelector('.cal');
  grid.addEventListener('mouseover', function (e) {
    var c = e.target.closest('.chip'); if (!c) return;
    var g = c.getAttribute('data-g');
    if (g) grid.querySelectorAll('.chip[data-g="' + g + '"]').forEach(function (x) { x.classList.add('hl'); });
  });
  grid.addEventListener('mousemove', function (e) { var c = e.target.closest('.chip'); if (c) showTip(e, esc(c.getAttribute('data-t')).replace(/\n/g, '<br>')); else hideTip(); });
  grid.addEventListener('mouseout', function (e) {
    var c = e.target.closest('.chip'); if (!c) return;
    grid.querySelectorAll('.chip.hl').forEach(function (x) { x.classList.remove('hl'); }); hideTip();
  });
  grid.addEventListener('click', function (e) { var c = e.target.closest('.chip'); if (c && c.getAttribute('data-g')) { hideTip(); location.hash = 'g/' + c.getAttribute('data-g'); } });
}

function drawStrip(el, b) {
  var W = Math.max(el.clientWidth - 32, 280), H = 96, x0 = 16, x1 = W - 16, lo = 1500, hi = 1950;
  var sx = function (y) { return x0 + (y - lo) / (hi - lo) * (x1 - x0); };
  var s = '<svg width="' + W + '" height="' + H + '" role="img" aria-label="' + L('年代分布', 'Distribution over time') + '">';
  for (var t = 1500; t <= 1950; t += 50) s += '<line class="gridl" x1="' + sx(t) + '" x2="' + sx(t) + '" y1="6" y2="72"/><text x="' + sx(t) + '" y="88" text-anchor="middle">' + t + '</text>';
  s += '<text x="' + x0 + '" y="22" style="font-size:10px">' + L('实践', 'Practice') + '</text><text x="' + x0 + '" y="56" style="font-size:10px">' + L('申报', 'Shenbao') + '</text>';
  var pts = [];
  b.prac.forEach(function (p) { var y = +p.year; if (y >= lo && y <= hi) pts.push({ x: sx(y), y: 30, weak: p.ev === NOFAST, t: p.id + ' ' + p.year + '｜' + NT(p.place) + '｜' + C(p.ev) + '｜' + NT(p.wt) }); });
  b.sb.forEach(function (r) { var y = +String(r.date).slice(0, 4); if (y) pts.push({ x: sx(y), y: 62, sb: 1, t: r.date + '｜' + NT(r.title) + '｜' + NT(r.place) }); });
  pts.forEach(function (p, i) {
    var jit = ((i * 37) % 9) - 4;
    s += '<circle data-i="' + i + '" cx="' + p.x + '" cy="' + (p.y + jit) + '" r="5" stroke-width="2" style="' +
      (p.sb ? 'fill:var(--v2);stroke:var(--surface)' : p.weak ? 'fill:var(--surface);stroke:var(--ev1)' : 'fill:var(--ev1);stroke:var(--surface)') + '"/>';
  });
  s += '</svg>';
  el.innerHTML = s;
  el.querySelectorAll('circle').forEach(function (c) {
    var p = pts[+c.getAttribute('data-i')];
    c.addEventListener('mousemove', function (e) { showTip(e, esc(p.t)); });
    c.addEventListener('mouseleave', hideTip);
  });
}

    '<p class="small muted" style="margin-top:0">' + L('每个维度描述同一对象的不同层次，各自独立记录，不合成单一分类。', 'Each dimension describes a different level of the same object and is recorded separately, not merged into a single classification.') + '</p>' +
    '<div class="fw">' +
      lab('var(--v1)', L('第一层　内容层', 'Layer 1 · Content'), L('这份知识是什么', 'What this knowledge is'), L('条目', 'entries')) +
      dim('var(--v1)', L('时间编排', 'Temporal arrangement'), L('月日型、干支型、混合型', 'month-and-day, ganzhi, or mixed')) +
      dim('var(--v1)', L('条目构成', 'Composition of entries'), L('诞日、降日、升仙、斋期各占多少', 'shares of birthdays, descent days, ascensions and fasts')) +
      lab('var(--v4)', L('第二层　载体层', 'Layer 2 · Carrier'), L('放在哪里，由谁制作', 'Where it is placed, and who made it'), L('书、版本', 'books, editions')) +
      dim('var(--v4)', L('载体文类', 'Genre of carrier'), L('通书、类书、善书、宝卷、神灵全书、山志、课诵本', 'almanacs (tongshu 通書), encyclopedias (leishu 類書), morality books (shanshu 善書), precious scrolls (baojuan 寶卷), compendia of deities, mountain gazetteers, liturgical recitation books')) +
      dim('var(--v4)', L('生产与流通', 'Production and circulation'), L('坊刻、宫观寺院、善堂、抄本、官刻', 'commercial printers, temples and monasteries, charitable halls, manuscripts, official printing')) +
      lab('var(--accent)', L('第三层　使用层', 'Layer 3 · Use'), L('拿来做什么，给谁用', 'What it is used for, and by whom'), L('组成部分', 'components')) +
      dim('var(--accent)', L('功能', 'Function'), L('择日查阅、持斋发愿、科仪执行、劝善宣讲', 'consulting for day selection, vowing to fast, performing liturgy, preaching morality')) +
      dim('var(--accent)', L('预设使用者', 'Intended users'), L('一般信众（general）、宗教专业人士（expertise）', 'ordinary believers (general), religious specialists (expertise)'), L('原 general / expertise 区分移到这一层', 'the earlier general / expertise distinction moves to this layer')) +
      L('<div class="ax"><b class="t">传承轴</b><span class="s">知识从哪里来</span><br><b>传本谱系</b>共同的异文与错误、承袭关系<br><br><b>贯穿三层</b>内容、载体、用途都可能在传承中改变<br><br><span class="s">例：同一份降日表从道教日历进入类书，再进入通书，内容大致不变，载体与使用者改变。</span></div>',
        '<div class="ax"><b class="t">Axis of transmission</b><span class="s">Where the knowledge comes from</span><br><b>Textual lineage</b>shared variants and errors; relations of descent<br><br><b>Across all three layers</b>content, carrier and use may all change in transmission<br><br><span class="s">Example: the same table of descent days passes from a Daoist calendar into an encyclopedia and then into an almanac; the content stays largely the same while the carrier and users change.</span></div>') +
    '</div>' +
    '<div class="units"><div class="lab0">' + L('分析单位', 'Units of analysis') + '<div class="small muted" style="font-weight:400">' + L('属性各落在不同单位', 'each attribute belongs to a different unit') + '</div></div>' +
      L('<div class="u"><b>条目</b>某日某神某事<br>→ 诞、降、升仙等</div><span class="arr">归入 →</span>', '<div class="u"><b>Entry</b>a deity and an event on a given day<br>→ birthday, descent, ascension, etc.</div><span class="arr">belongs to →</span>') +
      L('<div class="u"><b>组成部分</b>书中一张表或一节<br>→ 时间编排、功能、使用者</div><span class="arr">归入 →</span>', '<div class="u"><b>Component</b>a table or section in a book<br>→ temporal arrangement, function, users</div><span class="arr">belongs to →</span>') +
      L('<div class="u"><b>书、版本</b>整部书<br>→ 文类、刊刻者、年代</div></div>', '<div class="u"><b>Book, edition</b>the whole book<br>→ genre, printer, date</div></div>') +
    L('<div class="card" style="margin-top:18px;font-size:14px"><b>跨层对应＝可检验的假设</b>　例一：生产主体（载体层）与条目构成（内容层）是否对应，如「宫观刊本多记降日」。例二：同一谱系中内容不变、使用者改变，如《事林廣記》把专业日历转入通识类书。</div>',
      '<div class="card" style="margin-top:18px;font-size:14px"><b>Cross-layer correspondences = testable hypotheses.</b> Example 1: do producers (carrier layer) correspond to the composition of entries (content layer), e.g. “temple editions record more descent days”? Example 2: within one lineage the content stays the same while the users change, e.g. the ' + SL + ' moving a specialist calendar into a general-knowledge encyclopedia.</div>');
  app.innerHTML = h;
}

// ---------- 路由 ----------
function route() {
  hideTip();
  if (window.ZhaiRing) ZhaiRing.hideTip();
  var hsh = location.hash.replace(/^#/, '') || 'overview';
  var v = hsh.split('/')[0];
  document.querySelectorAll('#nav a').forEach(function (a) { a.classList.toggle('on', a.getAttribute('data-v') === (v === 'g' ? 'gods' : v)); });
  if (v === 'g') viewGod(hsh.split('/')[1]);
  else if (v === 'matrix') viewMatrix();
  else if (v === 'calendar') viewCalendar();
  else if (v === 'gods') viewGods();
  else if (v === 'gaps') viewGaps();
  else if (v === 'context') viewContext();
  else if (v === 'ring') { app.innerHTML = ''; ZhaiRing.mount(app, window.ZHAI_RING); }
  else viewOverview();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
var rt; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(function () { var v = location.hash; if (!v || v === '#overview' || /^#g\//.test(v)) route(); }, 200); });
function footer() {
  document.getElementById('foot').innerHTML = L('数据来源：' + esc(D.source) + '。' + (D.noQuotes ? '公开版：实践记录、《申报》、风俗志及识典古籍所收斋期文本的原文摘录未收入，只列编号、摘要与编码。' : '') + '「已核对原书」目前全部为「否」：原文摘录多据电子文本或资料库全文，引用前请核原书。',
    'Data: ' + esc(D.source) + '. ' + (D.noQuotes ? 'Public version: quotations from practice records, the <i>Shenbao</i>, records of customs and calendar texts read in the Shidian guji 識典古籍 database are omitted; only IDs, summaries and codes are given. ' : '') +
    'No entry has yet been checked against the original book; quotations mostly follow electronic texts or database full text, so verify before citing. Proper names are given in pinyin with Chinese characters (pinyin generated automatically). Dates are lunar month/day. Research notes and summaries remain in Chinese.');
}
I.apply();
footer();
route();
})();
