<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --surface-2: #f2f1ed;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #6f6d68;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --accent: #8a2b1a;
  /* 配色規則：硃紅（--accent）只用於強調與數量（熱力圖、重合度矩陣）；分類一律用下面這套礦物色（--cat1…6 + 兩種灰），已過色盲檢驗 */
  --cat1: #245f94; --cat2: #9a7fd1; --cat3: #1a9178; --cat4: #bd8b18; --cat5: #3f9ad0; --cat6: #5f7f3a; --cat-o: #a59c8e; --cat-u: #cfccc4; --cat7: #b4443f; --cat8: #c2578f;   /* 石青 青蓮 石綠 藤黃 天青 苔綠 暖灰 鉛灰；cat7 紅（集會）、cat8 胭脂（誓願）只用於日期類型 */
  --v1: var(--cat1); --v2: var(--cat2); --v3: var(--cat3); --v4: var(--cat4);
  --ev1: #245f94; --ev2: #6b95c4; --ev3: #b3cbe5;   /* 證據強度（有序）：石青由深到淺 */
  /* 字體：中文一律黑體；英文、法文、數字用蘋果系統字體（SF），非蘋果設備用外觀相近的 Inter；史料原文用楷體
     拉丁字體排在最前，它們不含漢字，漢字自動落到後面的黑體或楷體 */
  --font-latin: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", "Helvetica Neue", Arial, "PingFang SC", "Noto Sans SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  /* 原文不放 -apple-system：Safari 會借系統字體把漢字也排成蘋方，楷體就沒了 */
  --font-src: "Inter", "Helvetica Neue", Arial, "LXGW WenKai TC", "Kaiti TC", "STKaiti", "KaiTi", "BiauKai", "AR PL UKai TW", "AR PL UKai CN", serif;
  --hl: #fff3c4;
  --yuan: #f6ebe7; --yuan-line: #dcbcb0;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #242422;
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #9a9892;
    --grid: #2c2c2a; --axis: #383835; --accent: #e0846f;
    --cat1: #3567b0; --cat2: #9a82d6; --cat3: #2aa470; --cat4: #ba881a; --cat5: #4f9bd9; --cat6: #6f9440; --cat-o: #8d877c; --cat-u: #55595d; --cat7: #b4443f; --cat8: #d77aa5;
    --ev1: #8fb3e0; --ev2: #4f7fc0; --ev3: #2c4b78;
    --hl: #4a3f12;
    --yuan: #2c201c; --yuan-line: #5a3a30;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #242422;
  --ink: #f0efec; --ink-2: #c3c2b7; --muted: #9a9892;
  --grid: #2c2c2a; --axis: #383835; --accent: #e0846f;
  --cat1: #3567b0; --cat2: #9a82d6; --cat3: #2aa470; --cat4: #ba881a; --cat5: #4f9bd9; --cat6: #6f9440; --cat-o: #8d877c; --cat-u: #55595d; --cat7: #b4443f; --cat8: #d77aa5;
  --ev1: #8fb3e0; --ev2: #4f7fc0; --ev3: #2c4b78;

}

}

.v-L0 { --c: var(--v1); } .v-L1 { --c: var(--v2); } .v-L2 { --c: var(--v3); } .v-L3 { --c: var(--v4); }
.v-W001 { --c: var(--v1); } .v-W014 { --c: var(--v2); } .v-W063 { --c: var(--v3); } .v-W085 { --c: var(--v4); }

/* calendar */

.cal > div { border-bottom: 1px solid var(--grid); border-right: 1px solid var(--grid); padding: 6px; }

}

.tag.dev { border-color: var(--v4); color: var(--ink); background: color-mix(in srgb, var(--v4) 14%, transparent); }

.fitg:not(.open) .tw { transform: rotate(-90deg); }   /* 展開／收起的小三角用 CSS 畫，不依賴字體 */
#menu::before { content: ''; display: inline-block; width: 13px; height: 10px; margin-right: 6px; vertical-align: 0; background: linear-gradient(currentColor 0 0) top / 100% 2px no-repeat, linear-gradient(currentColor 0 0) center / 100% 2px no-repeat, linear-gradient(currentColor 0 0) bottom / 100% 2px no-repeat; }   /* 目錄圖標：三道橫線 */
.fitg.open td { background: var(--surface-2); font-weight: 600; }

.rec.jump { background: var(--hl); transition: background 1.5s; }
/* ---- 刊刻地與版本線索圖 ---- */

@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .spread { --pfit: #4aa57c; --pdev: #d3a03a; --pnone: #8d877c; } }

.spread .sw2.pr-fit { background: var(--pfit); } .spread .sw2.pr-dev { background: var(--pdev); } .spread .sw2.pr-none { background: var(--pnone); }

.spread .sptab tbody tr { cursor: pointer; } .spread .sptab tbody tr:hover, .spread .sptab tbody tr.on { background: var(--hover, rgba(0,0,0,.04)); }

/* ---- 版本親疏 ---- */
.kin {
  /* 文本類型的顏色分兩族，與版本線索圖「玉匣記系統／其他齋曆」的兩分對應：
     玉匣記系統的三類（道藏本、單行本、通書）用藤黃一族，由深到淺按出現先後；其他齋曆（宮觀手冊、善書、日用類書）用石綠一族；未定用鉛灰。
     深淺用 color-mix 從分類色推出，深色模式下自動反轉，族內仍可分辨；泳道位置本身也區分類型 */
  --l1: color-mix(in srgb, var(--cat4) 62%, var(--ink));     /* 道藏本：深赭 */
  --l4: var(--cat4);                                          /* 單行本：藤黃 */
  --l5: color-mix(in srgb, var(--cat4) 55%, var(--page));    /* 通書：淺金 */
  --l2: color-mix(in srgb, var(--cat3) 62%, var(--ink));     /* 宮觀手冊：深青綠 */
  --l6: var(--cat3);                                          /* 善書：石綠 */

var FOCUS = null;

    var nm = key.slice(2), g = normGs(nm).filter(function (x) { return G[x]; })[0];
    if (g) return focusFromKey(g);

    return { key: key, g: '', name: nm, norms: o };
  }
  if (!G[key]) return null;
  var b = byG[key] || bucket(key), ns = {};
  Object.keys(b.norms).forEach(function (k) { ns[k] = 1; });
  return { key: key, g: key, name: G[key].name, norms: ns };
}
function setFocus(key) {

// ---------- 「這一天」：各版本這一天的條目（原文照錄）對照對上的實踐記錄 ----------
var DAY = { m: 0, d: 0, only: true };
function dayName(m, d) { return I.en() ? I.monDay(m, d) : MN[m] + FIT_DN(d); }
function rangeHas(r, m, d) {
  return String(r || '').split(/[；;]/).some(function (seg) {
    var a = seg.split('-').map(function (x) { return x.split('/').map(Number); });
    if (!a[0] || !a[0][1]) return false;
    var s = a[0][0] * 100 + a[0][1], t = a[1] && a[1][1] ? a[1][0] * 100 + a[1][1] : s, k = m * 100 + d;
    return k >= s && k <= t;
  });
}
function dayEntries(m, d) {

}

    (FOCUS ? '<label class="small dp-only"><input type="checkbox" id="dponly"' + (DAY.only ? ' checked' : '') + '> ' + L('只看聚焦神明 ', 'Only the focused deity ') + focusName() + (only ? L('（這一天共 ' + all.length + ' 條）', ' (' + all.length + ' entries on this day in all)', ' (' + all.length + ' entrées ce jour-là au total)') : '') + '</label>' : '') +

function edDeityPanel(box) {   // 版本目錄和內容對照「每行一個數據庫神明」：原「版本對照」頁
  var types = {}; D.deities.forEach(function (g) { types[g.type || '未分類'] = 1; });
  var h = L('<p class="lede small">每行一個神明（持齋研究數據庫），每列一個齋曆版本（版本對比工作簿，按年代）。格中是該神在該版本中的第一個日期（農曆），×n 爲條數，○ 爲有條目但不是具體月日；灰底列是《玉匣記》系統以外的文本。右側三列是敘事史料的條數（實踐記錄括號內爲言及持齋的條數）。神明與齋曆條目暫按名稱對應，標「待覈」者尚未覈對。點一行看神明檔案。</p>',
      '<p class="lede small">Each row is a deity of the fasting database; each column an edition of the calendars (comparison workbook, in chronological order). A cell gives the deity’s first (lunar) date in that edition; ×n is the number of entries, ○ an entry without a specific month and day; shaded columns are texts outside the <i>Yuxiaji</i> line. The three right-hand columns count narrative sources (in brackets: practice records that mention fasting). Deities are provisionally matched to calendar entries by name; “to verify” marks matches not yet checked. Click a row for the deity’s profile.</p>') +
    '<div class="controls">' +
    '<select id="mf">' + [['all', '全部文本', 'all texts'], ['yx', '只看《玉匣記》系統', 'Yuxiaji line only']].map(function (o) { return '<option value="' + o[0] + '"' + (EDF.fam === o[0] ? ' selected' : '') + '>' + L(o[1], o[2]) + '</option>'; }).join('') + '</select>' +
    '<input type="search" id="mq" placeholder="' + L('搜神名或異名', 'Search name or alias (Chinese or pinyin)') + '" value="' + esc(M.q) + '">' +
    '<select id="mt"><option value="">' + L('全部類型', 'All types') + '</option>' + Object.keys(types).map(function (t) { return '<option value="' + esc(t) + '"' + (M.type === t ? ' selected' : '') + '>' + esc(C(t)) + '</option>'; }).join('') + '</select>' +
    '<select id="mo">' +
    [['any', '全部神明', 'All deities'], ['prac', '有持齋實踐記錄', 'With fasting practice records'], ['gap', '有持齋實踐、但道藏本《玉匣記》（1607）未收', 'Fasting practice, but absent from the Daozang Yuxiaji (1607)'], ['nocal', '有持齋實踐、但所有齋曆版本都未收（或尚未對應）', 'Fasting practice, but in no calendar edition (or not yet matched)'], ['onlycal', '只見於齋曆、無任何敘事記錄', 'Only in calendars, no narrative record']]
      .map(function (o) { return '<option value="' + o[0] + '"' + (M.only === o[0] ? ' selected' : '') + '>' + L(o[1], o[2]) + '</option>'; }).join('') +
    '</select><span class="muted small" id="mcount"></span></div>' +
    '<div class="scroll"><table class="edm" id="mtab"></table></div>';
  box.innerHTML = h;
  var cols = EVS.filter(function (v) { return EDF.fam === 'all' || v.yuxia; });
  var fill = function () {
    var q = M.q.trim().toLowerCase();
    var rows = D.deities.filter(function (g) {
      var b = byG[g.id] || bucket(g.id), fp = fastPrac(b).length;
      if (q && (g.name + g.alias + ' ' + I.py(g.name)).toLowerCase().indexOf(q) < 0) return false;
      if (M.type && (g.type || '未分類') !== M.type) return false;
      if (M.only === 'prac' && !fp) return false;
      if (M.only === 'gap' && !(fp && !b.ed[V0])) return false;
      if (M.only === 'nocal' && !(fp && !b.nCal)) return false;
      if (M.only === 'onlycal' && !(b.nCal && !b.prac.length && !b.sb.length && !b.fs.length)) return false;
      return true;
    });
    var key = function (g) {
      var b = byG[g.id];
      if (M.sort === 'name') return g.id;
      if (M.sort === 'prac') return -(b.prac.length * 1000 + fastPrac(b).length);
      if (M.sort === 'sb') return -b.sb.length;
      if (M.sort === 'fs') return -b.fs.length;
      return -((b.ed[+M.sort.slice(1)] || []).length);
    };
    rows.sort(function (a, b) { var ka = key(a), kb = key(b); return ka < kb ? -1 : ka > kb ? 1 : (a.id < b.id ? -1 : 1); });
    document.getElementById('mcount').textContent = L(rows.length + ' 個神明', rows.length + ' deities', rows.length + ' divinités');
    var head = '<thead><tr><th class="edn sortable" data-s="name">' + L('神明', 'Deity') + '</th><th>' + L('類型', 'Type') + '</th>' +
      cols.map(function (v) { return edHead(v).replace('<th class="edc', '<th data-s="v' + v.i + '" class="sortable edc'); }).join('') +
      '<th class="sortable num" data-s="prac">' + L('實踐', 'Practice') + '</th><th class="sortable num" data-s="sb">' + L('申報', '<i>Shenbao</i>') + '</th><th class="sortable num" data-s="fs">' + L('風俗志', 'Customs') + '</th></tr></thead>';
    var body = rows.map(function (g) {
      var b = byG[g.id], fp = fastPrac(b).length;
      return '<tr class="row' + (FOCUS && FOCUS.g === g.id ? ' focus' : '') + '" data-g="' + g.id + '"><td class="edn"><b>' + N(g.name) + '</b>' + pendTag(b) + (fp && !b.ed[V0] ? '<br><span class="flag">' + L('道藏本未收', 'not in Daozang ed.') + '</span>' : '') + '</td><td class="small muted">' + esc(C(g.type)) + '</td>' +
        cols.map(function (v) { return edCell(v, b.ed[v.i], edJudged(v) && (b.ed[v.i] || []).some(edMinor) ? ' dv' : ''); }).join('') +
        '<td class="num">' + (b.prac.length ? b.prac.length + ' <span class="muted">(' + fp + ')</span>' : '<span class="cell-empty">0</span>') + '</td>' +
        '<td class="num">' + (b.sb.length || '<span class="cell-empty">0</span>') + '</td>' +
        '<td class="num">' + (b.fs.length || '<span class="cell-empty">0</span>') + '</td></tr>';
    }).join('');
    document.getElementById('mtab').innerHTML = head + '<tbody>' + body + '</tbody>';
    var fr = document.querySelector('#mtab tr.focus'); if (fr && !M.scrolled) { M.scrolled = 1; setTimeout(function () { fr.scrollIntoView({ block: 'center' }); }, 0); }
    document.querySelectorAll('#mtab th.sortable').forEach(function (th) { th.onclick = function (e) { e.preventDefault(); M.sort = th.getAttribute('data-s'); fill(); }; });
  };
  fill();
  document.getElementById('mf').onchange = function (e) { EDF.fam = e.target.value; edDeityPanel(box); decorate(); };
  document.getElementById('mq').oninput = function (e) { M.q = e.target.value; fill(); };
  document.getElementById('mt').onchange = function (e) { M.type = e.target.value; fill(); };
  document.getElementById('mo').onchange = function (e) { M.only = e.target.value; fill(); };
  document.getElementById('mtab').onclick = function (e) { if (e.target.closest('thead')) return; var tr = e.target.closest('tr.row'); if (tr) location.hash = 'g/' + tr.getAttribute('data-g'); };
}

// ---------- 視圖：齋期日曆 ----------
var CAL = { weak: false, vs: null };
function calDefault() {
  // 默認四個：道藏本 1607、1684、1891、《同善錄》正心致福齋期
  var pick = [function (v) { return +v.no === 1; }, function (v) { return v.year === 1684; }, function (v) { return v.year === 1891; }, function (v) { return /正心致福/.test(v.sheet); }];
  var out = [];
  pick.forEach(function (f) { var v = EVS.filter(f)[0]; if (v && out.indexOf(v.i) < 0) out.push(v.i); });
  EVS.forEach(function (v) { if (out.length < 4 && out.indexOf(v.i) < 0) out.push(v.i); });
  return out;
}
function viewCalendar() {
  if (!CAL.vs) CAL.vs = calDefault();
  var lanes = CAL.vs.map(function (vi, j) { return { v: ED.versions[vi], cls: 'v-L' + (j % 4) }; });   // 超過 4 欄時顏色循環，以欄頭書名爲準
  lanes.push({ p: 1 });
  var h = L('<h1>齋期日曆</h1><p class="lede">按月排列所選齋曆版本的神誕與齋日，最右一列是實踐記錄中的日期。把鼠標移到一個神名上，所有版本里同一個神都會高亮。神名後的綠點表示有實踐記錄對上這一條（黃點：存在偏差），鼠標移上去可看是哪幾條。點擊進入神明檔案或版本目錄和內容對照。</p>',
      '<h1>Fasting calendar</h1><p class="lede">Deity birthdays and fast days in the chosen editions, arranged by lunar month; the right-hand column gives dates from practice records. Hover over a deity and the same deity lights up in every column. A green dot after a name means a practice record has been matched to that entry (yellow: with deviation); hover to see which. Click to open the deity’s profile or its collation.</p>') +
    '<p class="small muted" style="margin:0 0 6px">' + L('選擇要對照的版本（已選 ' + CAL.vs.length + ' / ' + EVS.length + '；超過 4 個時表格可左右滑動）：', 'Choose editions to compare (' + CAL.vs.length + ' / ' + EVS.length + ' selected; with more than 4 the table scrolls sideways):', 'Choisir les éditions à comparer (' + CAL.vs.length + ' / ' + EVS.length + ' choisies ; au-delà de 4, le tableau défile horizontalement) :') +
      ' <button type="button" class="vall" data-all="1"' + (CAL.vs.length === EVS.length ? ' disabled' : '') + '>' + L('全選', 'Select all', 'Tout sélectionner') + '</button> <button type="button" class="vall" data-all="0"' + (CAL.vs.length ? '' : ' disabled') + '>' + L('全不選', 'Select none', 'Tout désélectionner') + '</button></p><div class="vpick">' + EVS.map(function (v) {
      var on = CAL.vs.indexOf(v.i) >= 0;
      return '<button type="button" data-v="' + v.i + '" aria-pressed="' + on + '">' + edWhen(v) + ' ' + N(v.short) + '</button>';
    }).join('') + '</div>' +
    '<div class="controls"><label><input type="checkbox" id="weak"' + (CAL.weak ? ' checked' : '') + '> ' + L('實踐記錄也顯示「僅日期巧合」（未言齋）的條目（虛線）', 'Also show practice records that only coincide with the date (no fasting mentioned; dotted)') + '</label></div>' +
    '<div class="legend">' + lanes.filter(function (l) { return l.v; }).map(function (l) { return '<span>' + vSw(l.cls) + edWhen(l.v) + ' ' + N(l.v.short) + '</span>'; }).join('') + '<span><span class="sw" style="background:var(--ink-2)"></span>' + L('實踐記錄', 'Practice records') + '</span></div>' +
    '<div class="scroll"><div class="cal" style="--lanes:' + lanes.length + '">' +
    '<div class="hd">' + L('月', 'Month') + '</div>' + lanes.map(function (l) {
      return '<div class="hd">' + (l.v ? vSw(l.cls) + '<a href="#ev/' + l.v.i + '">' + N(l.v.short) + '</a> <span class="muted small">' + edWhen(l.v) + '</span>' : L('實踐記錄 <span class="muted small">敘事史料</span>', 'Practice records <span class="muted small">narrative sources</span>')) + '</div>';
    }).join('');
  var chip = function (e, cls) {
    var k = eKey(e), nm = e.k ? N(e.k) : N(e.l || e.t || '—'), ps = PBYE[e.id] || [];
    var lk = ps.length ? ' lk' + (ps.every(isDev) ? ' dev' : '') : '';
    var pt = ps.length ? '\n' + L('實踐：', 'Practice: ') + ps.map(function (p) { return p.id + '（' + C(p.rel) + '）'; }).join(L('、', ', ')) : '';
    return '<span class="chip ' + cls + lk + (fNorm(e.k) ? ' fx' : '') + '"' + (k ? ' data-g="' + esc(k) + '"' : '') + ' data-t="' + esc(e.id + ' ' + (e.mo || '') + (e.dy || '') + '｜' + (e.t || e.g || '') + (e.q ? '｜' + e.q : '') + pt) + '">' + (e.d ? '<span class="dd">' + e.d + '</span>' : '') + nm + '</span>';
  };
  var cell = function (mn, l) {
    if (l.p) {
      var agg = {}, ord = [];
      D.practice.filter(function (p) { return p.mn === mn && p.g && (CAL.weak || p.ev !== NOFAST); }).forEach(function (p) {
        if (!agg[p.g]) { agg[p.g] = []; ord.push(p.g); }
        agg[p.g].push(p);
      });
      return ord.map(function (g) {
        var ps = agg[g], weak = ps.every(function (p) { return p.ev === NOFAST; });
        var t = ps.map(function (p) { var e = EBYID[pCal(p)]; return p.id + ' ' + DTX(p.date) + '｜' + C(p.period) + '｜' + NT(p.place) + '｜' + C(p.ev) + (e ? '｜→ ' + e.id + ' ' + NT(ED.versions[e.v].short) + ' ' + (e.mo || '') + (e.dy || '') + '（' + C(p.rel) + '）' : ''); }).join('\n');
        return '<span class="chip p' + (weak ? ' weak' : '') + '" data-g="' + g + '" data-t="' + esc(t) + '">' + N(gName(g)) + (ps.length > 1 ? ' <span class="dd">×' + ps.length + '</span>' : '') + '</span>';
      }).join('');
    }
    return ED.entries.filter(function (e) { return e.v === l.v.i && e.m === mn; }).map(function (e) { return chip(e, l.cls); }).join('');
  };
  for (var mn = 1; mn <= 12; mn++) {
    h += '<div class="mo">' + monthName(mn) + '</div>' + lanes.map(function (l) { return '<div>' + cell(mn, l) + '</div>'; }).join('');
  }
  h += '<div class="mo small">' + L('每月／不定', 'Monthly / unfixed') + '</div>' + lanes.map(function (l) {
    if (l.p) { var n = D.practice.filter(function (p) { return !p.mn && p.g && (CAL.weak || p.ev !== NOFAST); }).length; return '<div class="small muted">' + L(n + ' 條無法按月歸入', n + ' records cannot be assigned to a month', n + ' témoignages ne peuvent être placés dans un mois') + '</div>'; }
    return '<div>' + ED.entries.filter(function (e) { return e.v === l.v.i && !e.m; }).map(function (e) { return chip(e, l.cls); }).join('') + '</div>';
  }).join('');
  h += '</div></div>';
  app.innerHTML = h;
  putFocusNote(L('它的條目加框', 'its entries are outlined'));
  document.getElementById('weak').onchange = function (e) { CAL.weak = e.target.checked; viewCalendar(); };
  app.querySelectorAll('.vpick button').forEach(function (b) {
    b.onclick = function () {
      var vi = +b.getAttribute('data-v'), k = CAL.vs.indexOf(vi);
      if (k >= 0) CAL.vs.splice(k, 1); else CAL.vs.push(vi);
      CAL.vs.sort(function (a, c) { return EVS.indexOf(ED.versions[a]) - EVS.indexOf(ED.versions[c]); });
      viewCalendar();
    };
  });
  app.querySelectorAll('.vall').forEach(function (b) {
    b.onclick = function () { CAL.vs = b.getAttribute('data-all') === '1' ? EVS.map(function (v) { return v.i; }) : []; viewCalendar(); };
  });
  var grid = app.querySelector('.cal');
  grid.addEventListener('mouseover', function (e) {
    var c = e.target.closest('.chip'); if (!c) return;
    var g = c.getAttribute('data-g');
    if (g) grid.querySelectorAll('.chip[data-g="' + g.replace(/"/g, '\\"') + '"]').forEach(function (x) { x.classList.add('hl'); });
  });
  grid.addEventListener('mousemove', function (e) { var c = e.target.closest('.chip'); if (c) showTip(e, esc(c.getAttribute('data-t')).replace(/\n/g, '<br>')); else hideTip(); });
  grid.addEventListener('mouseout', function (e) {
    var c = e.target.closest('.chip'); if (!c) return;
    grid.querySelectorAll('.chip.hl').forEach(function (x) { x.classList.remove('hl'); }); hideTip();
  });
  grid.addEventListener('click', function (e) { var c = e.target.closest('.chip'); if (c && c.getAttribute('data-g')) { hideTip(); location.hash = keyHref(c.getAttribute('data-g')).slice(1); } });
}

// ---------- 視圖：實踐與齋曆 ----------
var FIT = { q: '', rel: '', open: {}, unit: 'rec', pres: 'half', day: 0, fast: true };
// 默認只計言及持齋的實踐記錄；「僅日期巧合」（原文未提持齋，只是日期與齋曆條目重合）可選擇加入
function fitEv(p) { return !FIT.fast || p.ev !== NOFAST; }
var FIT_HEAT = { cnt: {}, pres: function () { return false; } };
// 月日熱力圖：實踐記錄按所對齋曆條目的農曆月日落格；「規定」按已獲完整文本的版本（見證，1882/1891 算一個）統計
var FIT_PRES = null;
function fitPres() {
  if (FIT_PRES) return FIT_PRES;
  var K = window.ZHAI_KIN, inc = K && K.incl ? K.incl : [], ws = {}, day = {}, dq = {};
  ED.entries.forEach(function (e) {
    var v = ED.versions[e.v], no = +v.no;
    if (inc.indexOf(no) < 0 || !e.m || !e.d || e.p !== '正文') return;
    var w = no === 9 ? 8 : no, k = e.m * 100 + e.d; ws[w] = 1;
    (day[k] = day[k] || {})[w] = 1;
    if (e.q) (dq[k] = dq[k] || {})[w] = 1;
  });
  FIT_PRES = { W: Object.keys(ws).length, day: day, dq: dq };
  return FIT_PRES;
}
var FIT_MN = ['', '正', '二', '三', '四', '五', '六', '七', '八', '九', '十', '十一', '十二'];
function FIT_DN(d) { var n = ['', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十']; return d <= 10 ? '初' + n[d] : d < 20 ? '十' + n[d - 10] : d === 20 ? '二十' : d < 30 ? '廿' + n[d - 20] : '三十'; }
function fitDayOf(p) { var e = EBYID[pCal(p)]; return e && e.m && e.d && e.d <= 30 ? e.m * 100 + e.d : 0; }
function fitHeatHTML() {
  var sel = function (id, cur, opts) { return '<select id="' + id + '">' + opts.map(function (o) { return '<option value="' + o[0] + '"' + (cur === o[0] ? ' selected' : '') + '>' + L(o[1], o[2], o[3]) + '</option>'; }).join('') + '</select>'; };
  var mb = function (v, zh, en, fr, szh, sen, sfr) { return '<button type="button" data-fast="' + v + '" aria-pressed="' + ((FIT.fast ? 'fast' : 'all') === v) + '">' + L(zh, en, fr) + '<small>' + L(szh, sen, sfr) + '</small></button>'; };
  return '<h2>' + L('月日熱力圖', 'Lunar-day heat map') + '</h2>' +
    '<div class="fmode" id="ffast" role="group" aria-label="' + L('熱力圖顯示模式', 'Heat map mode', 'Mode de la carte de chaleur') + '">' +
    mb('fast', '只計言及持齋', 'Fasting mentioned', 'Jeûne mentionné', '原文明確提到持齋的實踐記錄', 'records whose text mentions fasting', 'témoignages dont le texte mentionne le jeûne') +
    mb('all', '含日期巧合', 'Incl. date coincidences', 'Avec coïncidences de date', '另加只與齋曆日期重合、未提持齋的記錄', 'adds records that only coincide in date', 'ajoute les témoignages qui ne coïncident que par la date') +
    '</div><p class="lede small">' +
    L('每格是一個農曆日（十二個月 × 三十日），按實踐記錄所對齋曆條目的月日落格；色越深，對上這一天的實踐越多。默認只計原文言及持齋的記錄；「僅日期巧合」的記錄（原文未提持齋，只是日期與齋曆條目重合）可用上方按鈕切換加入。計數單位可換成「不同文獻」或「不同地點」，用來區分是多處多書都有記載，還是某一種材料貢獻了多條。<b>描邊空格</b>是齋曆規定了、但沒有實踐記錄對上的日子；「規定」的標準可選，只統計已獲完整文本的 19 個見證（1882、1891 兩本算一個），只計正文條目。顏色深淺反映的是存世並被收集的記錄多少，不等於實際持齋的人數。點格子打開「這一天」：左邊是各版本這一天的條目，右邊是對上的實踐記錄。',
      'Each cell is a lunar day (12 months × 30 days); practice records fall on the month and day of the calendar entry they match, and darker means more. By default only records whose text mentions fasting are counted; records that only coincide in date (no fasting mentioned) can be added with the switch above. The unit can be switched to distinct sources or distinct places, to tell whether a day is attested in many places and books or by many records from one source. <b>Outlined empty cells</b> are days the calendars prescribe but no practice record matches; choose what counts as prescribed. Only the 19 witnesses with a complete text (1882 and 1891 count as one) and main-table entries are counted. Shading reflects how many records survive and were collected, not how many people fasted. Click a cell to open “this day”: each edition’s entries for the day beside the practice records matched to them.') + '</p>' +

é qui</b>. Passer à « dates minoritaires communes » pour voir en rouge les dates que les deux éditions donnent mais que la plupart des autres ne donnent pas (voir la feuille 日期異文 du classeur) ; ces écarts partagés indiquent plus nettement une relation directe. Les flèches noires marquent les filiations appuyées par des preuves textuelles (trait plein : certaine ; tirets : candidate).</p>') +

    ps.forEach(function (p) {

function drawStrip(el, b) {
  var W = Math.max(el.clientWidth - 32, 280), H = 96, x0 = 16, x1 = W - 16, lo = 1500, hi = 1950;
  var sx = function (y) { return x0 + (y - lo) / (hi - lo) * (x1 - x0); };
  var s = '<svg width="' + W + '" height="' + H + '" role="img" aria-label="' + L('年代分佈', 'Distribution over time') + '">';
  for (var t = 1500; t <= 1950; t += 50) s += '<line class="gridl" x1="' + sx(t) + '" x2="' + sx(t) + '" y1="6" y2="72"/><text x="' + sx(t) + '" y="88" text-anchor="middle">' + t + '</text>';
  s += '<text x="' + x0 + '" y="22" style="font-size:10px">' + L('實踐', 'Practice') + '</text><text x="' + x0 + '" y="56" style="font-size:10px">' + L('申報', 'Shenbao') + '</text>';
  var pts = [];
  b.prac.forEach(function (p) { var y = +p.year; if (y >= lo && y <= hi) pts.push({ x: sx(y), y: 30, weak: p.ev === NOFAST, t: p.id + ' ' + p.year + '｜' + NT(p.place) + '｜' + C(p.ev) + '｜' + NT(p.wt) }); });
  b.sb.forEach(function (r) { var y = +String(r.date).slice(0, 4); if (y) pts.push({ x: sx(y), y: 62, sb: 1, t: r.date + '｜' + NT(r.title) + '｜' + NT(r.place) }); });
  pts.forEach(function (p, i) {
    var jit = ((i * 37) % 9) - 4;
    s += '<circle data-i="' + i + '" cx="' + p.x + '" cy="' + (p.y + jit) + '" r="5" stroke-width="2" style="' +
      (p.sb ? 'fill:var(--v2);stroke:var(--surface)' : p.weak ? 'fill:var(--surface);stroke:var(--ev1)' : 'fill:var(--ev1);stroke:var(--surface)') + '"/>';
  });
  s += '</svg>';
  el.innerHTML = s;
  el.querySelectorAll('circle').forEach(function (c) {
    var p = pts[+c.getAttribute('data-i')];
    c.addEventListener('mousemove', function (e) { showTip(e, esc(p.t)); });
    c.addEventListener('mouseleave', hideTip);
  });
}

// 默認步驟在 demo.js（window.ZHAI_DEMO）；在頁面上「編輯步驟」改過的存在瀏覽器裏，可「導出」後貼回 demo.js
var DEMO = { on: false, i: 0 };
function demoSteps() {

  return (window.ZHAI_DEMO || []).slice();
}
function demoSave(s) { try { localStorage.setItem('zhai-demo', JSON.stringify(s)); } catch (e) {} }

function demoGo(i) {

}
function demoExit() {

addEventListener('keydown', function (e) {

  else if (e.key === 'ArrowLeft' || e.key === 'PageUp' || (e.key === ' ' && e.shiftKey)) { e.preventDefault(); demoGo(DEMO.i - 1); }
  else if (e.key === 'Escape' && !document.querySelector('#daypanel:not([hidden]), #cmppanel:not([hidden])')) demoExit();
});
function demoEdit() {
  var box = document.getElementById('demoedit');
  if (!box) { box = document.createElement('div'); box.id = 'demoedit'; box.className = 'demoedit'; box.setAttribute('role', 'dialog'); document.body.appendChild(box); }
  box.hidden = false;
  var s = demoSteps(), lk = I.lang;
  box.innerHTML = '<div class="de-box"><div class="cp-head"><div class="cp-title">' + L('編輯演示步驟', 'Edit presentation steps', 'Modifier les étapes') + '</div><button type="button" class="dp-close" data-de="x" aria-label="' + L('關閉', 'Close') + '">✕</button></div>' +
    '<p class="small muted">' + L('說明文字按當前界面語言編輯（現在是', 'Captions are edited in the current interface language (now ', 'Les légendes sont modifiées dans la langue de l’interface (actuellement ') + { zh: '中文', en: 'English', fr: 'français' }[lk] + L('）。「加入當前畫面」會把頁面現在的樣子（含篩選、聚焦、年代、打開的「這一天」）存爲新的一步。改動存在本瀏覽器裏；要讓別的電腦也用，點「導出」把內容交給維護者貼進 demo.js。',
      '). “Add current view” saves the page as it is now (filters, focus, years, open “this day”) as a new step. Changes are stored in this browser; to use them elsewhere, “Export” and paste into demo.js.',
      '). « Ajouter la vue actuelle » enregistre la page telle qu’elle est (filtres, sélection, années, « ce jour » ouvert) comme nouvelle étape. Les modifications restent dans ce navigateur ; pour les utiliser ailleurs, « Exporter » et coller dans demo.js.') + '</p><ol class="de-list">' +
    s.map(function (st, i) {

function route(ev) {
  hideTip(true); hcHide(); closeDay();
  timeStop(true);   // 先停下上一頁的播放，再讀網址狀態；否則年代提示條會停在播放到一半的年份
  if (window.ZhaiRing) ZhaiRing.hideTip();
  var hsh = location.hash.replace(/^#/, '') || 'ring', qi = hsh.indexOf('?'), qs = null, after = {};
  if (qi >= 0) { qs = qsParse(hsh.slice(qi + 1)); hsh = hsh.slice(0, qi) || 'ring'; history.replaceState(null, '', location.pathname + location.search + '#' + hsh); }   // 帶狀態的鏈接：讀入後從地址欄去掉
  var v = hsh.split('/')[0];
  if (qs) { after = shareApply(v, qs); ev = null; }
  if (v === 'overview') { history.replaceState(null, '', location.pathname + location.search + '#ring'); hsh = v = 'ring'; }   // 舊網址 #overview：概覽已併入環形曆
  if (v === 'matrix') { history.replaceState(null, '', location.pathname + location.search + '#editions'); hsh = v = 'editions'; EDF.rows = 'zs'; }   // 舊網址 #matrix：版本對照已併入版本目錄和內容對照
  if (v === 'cmp') { history.replaceState(null, '', location.pathname + location.search + '#kin' + hsh.slice(3)); hsh = 'kin' + hsh.slice(3); v = 'kin'; }   // 舊網址 #cmp/甲/乙
  var ab = v === 'kin' ? hsh.split('/').slice(1) : [], kinFast = !!(ev && ev.type === 'hashchange') && v === 'kin' && LAST_V === 'kin', keepY = false;
  if (hsh !== LAST_HASH) { PREV_V = LAST_V; PREV_HASH = LAST_HASH; LAST_HASH = hsh; }   // 記住上一頁，詳情頁的「← 返回」回到來處
  LAST_V = v;
  if (v !== 'kin' || !ab[0]) closeCmp(true);
  M.scrolled = 0; EDF.scrolled = 0; TIME_HOOK = null; TIME_MIN = 0; timeStop(true);
  var navV = v === 'g' ? 'gods' : (v === 'ed' || v === 'ev') ? 'editions' : v;
  document.querySelectorAll('#nav a').forEach(function (a) { a.classList.toggle('on', a.getAttribute('data-v') === navV); });
  menuLabel(); menuOpen(false);
  if (v === 'g') viewGod(hsh.split('/')[1], hsh.split('/')[2]);
  else if (v === 'fit') { if (hsh.split('/')[1]) FIT.q = safeDecode(hsh.split('/')[1]); viewFit(); }
  else if (v === 'editions') viewEditions();
  else if (v === 'ed') viewEdGod(safeDecode(hsh.slice(3)));
  else if (v === 'ev') viewEdVersion(hsh.split('/')[1], hsh.split('/')[2]);
  else if (v === 'calendar') viewCalendar();
  else if (v === 'gods') viewGods();
  else if (v === 'gaps') viewGaps();
  else if (v === 'context') viewContext();
  else if (v === 'ring') viewRing(hsh.split('/')[1]);
  else if (v === 'spread') viewSpread();
  else if (v === 'kin') { if (!(kinFast && app.querySelector('.kin'))) viewKinship(); else keepY = true; }
  else viewRing();
  if (!keepY) window.scrollTo(0, 0);
  if (ab[0]) openCmp(ab[0], ab[1]);
  if (v === 'ring' && RING_SET && window.ZhaiRing) { var rs = RING_SET; RING_SET = null; setTimeout(function () { ZhaiRing.set(rs); }, 30); }
  if (after.day && after.day[1]) openDay(after.day[0], after.day[1]);
  if (after.play && (v === 'fit' || v === 'spread')) setTimeout(timePlay, 400);
  if (after.sec) setTimeout(function () { var el = document.getElementById(after.sec); if (el) el.scrollIntoView({ block: 'start' }); }, 150);
  if (DEMO.on) demoRender();
  decorate();
}
